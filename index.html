// ---------- โหมดแอดมิน (ผู้ให้บริการ): ร้านทั้งหมด · สร้างร้าน 4 ขั้น · จัดการพนักงาน ----------
let adm = { view: 'home' }, admData = {};
const WZ_KEY = 'kp.wizard';
// ---------- รอบจ่ายเงิน + กะ (ใช้ร่วมกัน: wizard · ตั้งค่าเจ้าของ · หน้าร้านแอดมิน) ----------
const CYCLES = [['ครึ่งเดือน', 'ครึ่งเดือน', 'แบบลาบรื่น'], ['เดือน', 'รายเดือน', 'เดือนละครั้ง'], ['สัปดาห์', 'รายสัปดาห์', 'ทุกสัปดาห์']];
const DOW_ALL = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'], DOW_FULL = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const SH_DEF = () => [{ name: 'เช้า', in: '06:00', out: '14:00' }, { name: 'บ่าย', in: '14:00', out: '22:00' }, { name: 'ดึก', in: '22:00', out: '06:00' }];
const dTxt = d => `${d.getDate()} ${TH_M[d.getMonth()]}`;
/** สูตรเดียวกับเซิร์ฟเวอร์ (periodByRule_) — ใช้แสดงตัวอย่างเท่านั้น */
function cycleRange(c, d) {
  const y = d.getFullYear(), mo = d.getMonth(), day = d.getDate(), last = new Date(y, mo + 1, 0).getDate();
  if (c.kind === 'สัปดาห์') { const e = new Date(y, mo, day + ((DOW_ALL.indexOf(c.dow) - d.getDay() + 7) % 7)); return [new Date(e.getFullYear(), e.getMonth(), e.getDate() - 6), e]; }
  if (c.kind === 'เดือน') {
    const n = +c.cut || 31;
    if (n >= 31) return [new Date(y, mo, 1), new Date(y, mo, last)];
    const at = (yy, mm) => new Date(yy, mm, Math.min(n, new Date(yy, mm + 1, 0).getDate()));
    let e = at(y, mo); if (day > e.getDate()) e = at(y, mo + 1);
    const pe = at(e.getFullYear(), e.getMonth() - 1);
    return [new Date(pe.getFullYear(), pe.getMonth(), pe.getDate() + 1), e];
  }
  const cut = +c.cut;
  if (cut <= 0 || cut >= last) return [new Date(y, mo, 1), new Date(y, mo, last)];
  return day <= cut ? [new Date(y, mo, 1), new Date(y, mo, cut)] : [new Date(y, mo, cut + 1), new Date(y, mo, last)];
}
function cycleTxt(c) {
  const head = c.kind === 'สัปดาห์' ? `ตัดทุกวัน${DOW_FULL[DOW_ALL.indexOf(c.dow)] || ''}` :
               c.kind === 'เดือน' ? (+c.cut >= 31 ? 'ตัดสิ้นเดือน' : `ตัดทุกวันที่ ${c.cut}`) : `รอบแรกถึงวันที่ ${c.cut} · รอบสองถึงสิ้นเดือน`;
  const r = cycleRange(c, new Date(nowMs()));
  return `${head} · งวดนี้ ${dTxt(r[0])} – ${dTxt(r[1])}`;
}
function cycleBox(p, c, open) {
  let tune = '';
  if (open && c.kind === 'สัปดาห์') tune = `<span class="lb">ตัดรอบทุกวัน (วันสุดท้ายของงวด)</span><div class="days">${WEEK.map(d => `<button data-cyd="${p}" data-v="${d}" class="${c.dow === d ? 'on' : ''}" aria-pressed="${c.dow === d}">${d}</button>`).join('')}</div>`;
  if (open && c.kind === 'เดือน') tune = `<label for="${p}_cut">ตัดรอบทุกวันที่</label><select id="${p}_cut">${Array.from({ length: 30 }, (_, i) => `<option value="${i + 1}" ${+c.cut === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('')}<option value="31" ${+c.cut >= 31 ? 'selected' : ''}>สิ้นเดือน</option></select>`;
  if (open && c.kind === 'ครึ่งเดือน') tune = `<label for="${p}_cut">รอบแรกถึงวันที่</label><select id="${p}_cut">${Array.from({ length: 27 }, (_, i) => `<option value="${i + 1}" ${+c.cut === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('')}</select>`;
  return `<div class="types three">${CYCLES.map(x => `<button data-cyk="${p}" data-v="${x[0]}" class="${c.kind === x[0] ? 'on' : ''}" aria-pressed="${c.kind === x[0]}">${x[1]}<small>${x[2]}</small></button>`).join('')}</div>
    <div class="muted" id="${p}_sub" style="font-size:16px;margin:8px 0 4px">${esc(cycleTxt(c))}</div>
    <button class="tune-btn" data-cyt="${p}" aria-expanded="${!!open}">${open ? 'ปิด' : 'เลือกวันตัดรอบ ›'}</button>
    ${tune ? `<div class="tune blk" style="margin-top:8px">${tune}</div>` : ''}`;
}
/** onKind/onDow/onToggle วาดใหม่ · เปลี่ยนวันที่ (select) แค่อัปเดตบรรทัดตัวอย่าง */
function wireCycle(p, c, redraw, toggle) {
  document.querySelectorAll(`[data-cyk="${p}"]`).forEach(b => b.onclick = () => {
    if (c.kind !== b.dataset.v) { c.kind = b.dataset.v; c.cut = c.kind === 'เดือน' ? 31 : c.kind === 'ครึ่งเดือน' ? 15 : c.cut; }
    redraw();
  });
  document.querySelectorAll(`[data-cyd="${p}"]`).forEach(b => b.onclick = () => { c.dow = b.dataset.v; redraw(); });
  const t = document.querySelector(`[data-cyt="${p}"]`); if (t) t.onclick = toggle;
  const sel = document.getElementById(p + '_cut');
  if (sel) sel.onchange = () => { c.cut = +sel.value; const sb = document.getElementById(p + '_sub'); if (sb) sb.textContent = cycleTxt(c); redraw(true); };
}
function sftCls(name, list) { if (name === 'หยุด') return 'off'; const i = (list || []).findIndex(x => x.name === name); return i < 0 ? 'na' : 'c' + (i % 8); }
function shiftEd(p, st) {
  const rows = st.list.map((x, i) => `<div class="shrow"><input class="sn" data-sh="${p}" data-i="${i}" data-sf="name" value="${esc(x.name)}" placeholder="ชื่อกะ เช่น เช้า" maxlength="12" aria-label="ชื่อกะที่ ${i + 1}">

      <span>เข้า</span><input type="time" data-sh="${p}" data-i="${i}" data-sf="in" value="${esc(x.in)}" aria-label="เวลาเข้ากะที่ ${i + 1}">
      <span>เลิก</span><input type="time" data-sh="${p}" data-i="${i}" data-sf="out" value="${esc(x.out)}" aria-label="เวลาเลิกกะที่ ${i + 1}"></div>`).join('');
  return `<div class="tg" style="padding:6px 0"><span>ร้านนี้ทำงานเป็นกะ<small>${st.on ? `${st.list.length} กะ · ผู้จัดการจัดกะในแท็บ ตารางกะ` : 'ปิด = ทุกคนเข้าเวลาเดียวกัน (แบบเดิม)'}</small></span>

function shiftEdErr(st) {

function wirePaySet(p, redraw, saveCyc, saveSh) {

/** กติกาชื่อเดียวกับเซิร์ฟเวอร์ (nameErr_ ใน Code.gs) */
function nameErr(n) {
  if (n.length > 20) return 'ชื่อยาวไม่เกิน 20 ตัว';
  if (!/^[฀-๿a-zA-Z0-9]+$/.test(n)) return 'ใช้ได้แค่ตัวไทย อังกฤษ หรือตัวเลข (ไม่มีจุด ขีด หรือสัญลักษณ์)';
  if (/^\d+$/.test(n) || /^\d+แรง/.test(n)) return 'ชื่อเหมือนตัวเลข/จำนวนแรง ใช้ไม่ได้';
  if (['เหตุผล', 'เพราะ', 'ยืนยัน', 'พรุ่งนี้', 'วันนี้', 'เมื่อวาน', 'ทุกคน'].indexOf(n) >= 0) return 'ชื่อซ้ำกับคำในคำสั่ง ใช้ไม่ได้';
  return '';
}

/** ตรวจการ์ดพนักงานทีละคน → { errs: [ข้อความต่อแถว], ok, list } */
function staffCheck() {
  const errs = [], seen = {}, list = [];
  if (wz.owner.trim()) seen[wz.owner.trim()] = 1;
  wz.staff.forEach((p, i) => {
    const name = String(p.name || '').trim(), wage = String(p.wage === undefined ? '' : p.wage).trim();
    let e = '';
    if (!name && !wage) { errs[i] = ''; return; }                       // แถวว่าง = ข้าม
    if (!name) e = 'ใส่ชื่อเล่นก่อน';
    else if (/\s/.test(name)) e = 'ชื่อเล่นต้องเป็นคำเดียว (ไม่มีเว้นวรรค)';
    else if (nameErr(name)) e = nameErr(name);
    else if (seen[name]) e = `ชื่อ “${name}” ซ้ำ`;
    else if (wage === '' || !isFinite(+wage) || +wage < 0) e = 'ใส่เงินต่อวันเป็นตัวเลข';
    errs[i] = e;
    if (name) seen[name] = 1;
    if (!e) list.push({ name, wage: +wage, dept: p.dept || '', manager: !!p.manager, shift: p.shift || '' });
  });
  return { errs, ok: errs.every(e => !e), list };
}
function parsePaste(txt) {
  const out = [], errs = [];
  String(txt || '').split('\n').forEach((line, i) => {
    const t = line.trim().split(/\s+/).filter(String);
    if (!t.length) return;
    const wi = t.findIndex((x, j) => j > 0 && /^\d+(\.\d+)?$/.test(x.replace(/,/g, '')));
    if (wi < 0) { errs.push(`บรรทัด ${i + 1} “${t[0]}” ยังไม่มีค่าแรง`); return; }
    if (wi > 1) { errs.push(`บรรทัด ${i + 1} ชื่อต้องเป็นคำเดียว (“${t.slice(0, wi).join(' ')}”)`); return; }
    out.push({ name: t[0], wage: +t[wi].replace(/,/g, ''), dept: t.slice(wi + 1).join(' ') });
  });
  return { staff: out, errs };
}

      <div class="field"><label for="wEmail">Gmail เจ้าของร้าน (ไม่บังคับ)</label><input id="wEmail" type="email" inputmode="email" value="${esc(wz.email || '')}" placeholder="ส่งไฟล์ข้อมูลร้านไปไว้ใน Drive ของเจ้าของ" autocomplete="off"></div>
      <div class="field"><span class="lb">ตำแหน่งร้าน</span>${locBox('wl', wz.lat !== null ? { lat: wz.lat, lng: wz.lng } : null, wz.gps)}</div>
      <div class="row" style="flex-wrap:nowrap"><div class="field" style="flex:1"><label for="wOpen">เวลาเข้างาน</label><input type="time" id="wOpen" value="${esc(wz.open)}"></div>
        <div class="field" style="flex:1"><label for="wClose">เวลาปิดร้าน</label><input type="time" id="wClose" value="${esc(wz.close)}"></div></div>
      <div class="field" style="margin:0"><span class="lb">วันหยุดร้าน</span><div class="days">${WEEK.map(d => `<button data-d="${d}" class="${wz.holidays.indexOf(d) >= 0 ? 'on' : ''}" aria-pressed="${wz.holidays.indexOf(d) >= 0}">${d}</button>`).join('')}</div></div>
      </div>${nav(okName())}
      ${wz.lat === null ? '<div class="muted center" style="margin-top:8px">ยังไม่มีตำแหน่งก็ไปต่อได้ ตั้งทีหลังในหน้าร้านได้</div>' : ''}`;
  } else if (st === 2) {
    const tg = (key, title, sub, tuneKey, fields) => `<div class="tg" style="flex-wrap:wrap;padding:6px 0"><span>${title}<small id="sub_${key}">${sub}</small></span>
        <input type="checkbox" class="sw" id="w_${key}" ${wz[key] ? 'checked' : ''} aria-label="${title}"></div>
      ${wz[key] ? `<div style="margin:-2px 0 8px"><button class="tune-btn" data-tune="${tuneKey}" aria-expanded="${wz.tune === tuneKey}">${wz.tune === tuneKey ? 'ปิด' : 'ปรับตัวเลข ›'}</button></div>
        ${wz.tune === tuneKey ? `<div class="tune">${fields}</div>` : ''}` : ''}`;
    h = `${steps}<div class="stepname">ขั้น 2 · ประเภทร้าน + ตัวเลข</div>
      <div class="types">${TYPES.map(t => `<button data-type="${t.id}" class="${wz.type === t.id ? 'on' : ''}">${t.name}<small>${t.sub}</small></button>`).join('')}</div>
      <div class="gap"></div><div class="card" style="padding:6px 18px">
        ${tg('ot', 'มี OT', otTxt(), 'ot', num('nOtB', 'บาทต่อรอบ', 'otBaht', 'บาท') + num('nOtF', 'ได้รอบแรกเมื่อเลยเวลาปิด', 'otFirst', 'นาที') + num('nOtS', 'รอบถัดไปทุก', 'otStep', 'นาที'))}
        ${tg('food', 'ค่าอาหาร', `วันละ ${baht(wz.foodBaht)} บาท`, 'food', num('nFood', 'ค่าอาหารต่อวัน', 'foodBaht', 'บาท'))}
        ${tg('fine', 'หักสาย', fineTxt(), 'fine', num('nFine', 'หักนาทีละ', 'fineBaht', 'บาท') + num('nGrace', 'สายไม่เกินกี่นาทีไม่หัก', 'graceMin', 'นาที') + num('nPass', 'ค่าขอเข้าสาย ต่อครั้ง', 'passFee', 'บาท'))}
      </div>
      <div class="card"><h2>💰 รอบจ่ายเงิน</h2>${cycleBox('wc', wz.cyc, wz.tune === 'cyc')}</div>
      <div class="card"><h2>📅 หักแรงต่อวัน</h2><div class="muted" style="font-size:16px">ลา/ขาดแต่ละวัน หักกี่แรง · ${wz.ded ? 'ตั้งเองแล้ว' : 'ใช้ตารางมาตรฐาน'}</div>
        <div class="more center">${moreBtn('wded', wz.ded ? 'แก้ตาราง' : 'ตั้งเอง')}</div>${moreBox('wded', dedEd('wd', wz.ded || dedStd()) +
        `<div class="row" style="margin-top:8px"><button class="small-btn" id="wdSave" style="flex:1">ใช้ตารางนี้</button>${wz.ded ? '<button class="small-btn ghost" id="wdStd">กลับไปใช้มาตรฐาน</button>' : ''}</div>`)}</div>
      <div class="card" style="padding:6px 18px">${shiftEd('ws', wz.sh)}<div class="err" id="wsErr">${esc(shiftEdErr(wz.sh))}</div></div>
      <div class="muted center">เปลี่ยนตัวเลขทีหลังได้ในหน้าตั้งค่าร้าน</div>${nav(!shiftEdErr(wz.sh))}`;
  } else if (st === 3) {
    const sc = staffCheck();
    const opts = sel => wz.depts.map(d => `<option ${d === sel ? 'selected' : ''}>${esc(d)}</option>`).join('') + '<option value="__new">＋ เพิ่มตำแหน่งใหม่…</option>';
    const rows = wz.staff.map((p, i) => `<div class="srow">
        <div class="r"><input class="n" data-i="${i}" data-f="name" value="${esc(p.name)}" placeholder="ชื่อเล่น" maxlength="20" aria-label="ชื่อเล่นคนที่ ${i + 1}">
          <input class="w" type="number" inputmode="numeric" min="0" data-i="${i}" data-f="wage" value="${esc(p.wage)}" placeholder="บาท/วัน" aria-label="เงินต่อวันคนที่ ${i + 1}">
          <button class="x" data-del="${i}" aria-label="ลบคนที่ ${i + 1}">✕</button></div>
        <div class="r"><select class="d" data-i="${i}" data-f="dept" aria-label="ตำแหน่งคนที่ ${i + 1}">${opts(p.dept)}</select>
          <label class="chk"><input type="checkbox" data-i="${i}" data-f="manager" ${p.manager ? 'checked' : ''}>ผู้จัดการ</label></div>
        ${wz.sh.on ? `<div class="r"><span class="muted" style="font-size:15px;flex:none">กะประจำ</span><select class="d" data-i="${i}" data-f="shift" aria-label="กะประจำคนที่ ${i + 1}">${wz.sh.list.map(x => `<option ${x.name === (p.shift || wz.sh.list[0].name) ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>` : ''}
        <div class="err" id="serr${i}">${esc(sc.errs[i] || '')}</div></div>`).join('');
    h = `${steps}<div class="stepname">ขั้น 3 · พนักงาน</div>
      <div class="card"><div class="muted" style="margin-bottom:10px">ใส่ทีละคน: ชื่อเล่น · เงินต่อวัน · ตำแหน่ง · ${esc(wz.owner || 'เจ้าของร้าน')} ถูกเพิ่มเป็นเจ้าของให้แล้ว</div>
        ${rows || '<div class="muted center" style="margin-bottom:10px">ยังไม่มีพนักงาน — เพิ่มทีหลังได้</div>'}
        <button class="btn quiet" id="wAdd" style="margin:0">＋ เพิ่มพนักงาน</button>
        ${wz.addDept ? `<div class="row" style="flex-wrap:nowrap;margin-top:12px"><input id="wDeptNew" placeholder="ชื่อตำแหน่งใหม่ เช่น บาริสต้า" style="flex:1;min-width:0" maxlength="20">
          <button class="small-btn" id="wDeptAdd">เพิ่ม</button></div>` : ''}
        <div class="more">${moreBtn('wpaste', 'วางรายชื่อทีเดียว')}</div>
        ${moreBox('wpaste', `<div class="field" style="margin:0"><label for="wPaste">ชื่อ ค่าแรง ตำแหน่ง (บรรทัดละคน)</label>
          <textarea id="wPaste" placeholder="หนึ่ง 500 ครัว&#10;แอน 420 หน้าร้าน">${esc(wz.paste)}</textarea></div>
          <button class="small-btn" id="wPasteGo" style="margin-top:8px;width:100%">เติมเป็นการ์ดพนักงาน</button>`)}</div>
      ${nav(sc.ok)}`;
  } else {
    const sc = staffCheck(), t = TYPES.filter(x => x.id === wz.type)[0] || TYPES[0];
    if (!wz.until) { wz.until = addMonthKey(1); saveWz(); }
    const row = (a, b) => `<div class="item"><div class="main muted" style="font-size:17px">${a}</div><div style="font-weight:700;text-align:right">${b}</div></div>`;
    const mgr = sc.list.filter(x => x.manager).map(x => x.name);
    h = `${steps}<div class="stepname">ขั้น 4 · สรุป</div><div class="card"><div class="list">
      ${row('ชื่อร้าน', esc(wz.name))}${row('เจ้าของ', esc(wz.owner))}
      ${row('เวลา', `${esc(wz.open)}–${esc(wz.close)}${wz.holidays.length ? ' · หยุด ' + esc(wz.holidays.join(' ')) : ''}`)}
      ${row('ตำแหน่งร้าน', wz.lat !== null ? 'ได้แล้ว · รัศมี 150 ม.' : '<span style="color:var(--warn)">ยังไม่มี</span>')}
      ${row('ประเภท', esc(t.name))}
      ${row('รอบจ่ายเงิน', esc(CYCLES.filter(x => x[0] === wz.cyc.kind)[0][1] + ' · ' + cycleTxt(wz.cyc).split(' · งวดนี้')[0]))}
      ${row('กะ', wz.sh.on ? esc(wz.sh.list.map(x => `${x.name} ${x.in}–${x.out}`).join(' · ')) : 'ไม่มี (เวลาเดียวกันทั้งร้าน)')}
      ${row('OT', wz.ot ? esc(otTxt()) : 'ไม่มี')}${row('ค่าอาหาร', wz.food ? `วันละ ${baht(wz.foodBaht)} บาท` : 'ไม่มี')}${row('หักสาย', wz.fine ? esc(fineTxt()) : 'ไม่หัก')}
      ${row('พนักงาน', `${sc.list.length + 1} คน (รวมเจ้าของ)${mgr.length ? '<br><span class="muted" style="font-size:15px">ผู้จัดการ: ' + esc(mgr.join(', ')) + '</span>' : ''}`)}</div>
      <div class="field" style="margin:14px 0 0"><label for="wUntil">ค่าบริการครบกำหนด (รายเดือน)</label><input type="date" id="wUntil" value="${esc(wz.until)}">
        <span class="muted" style="font-size:15px">ตั้งต้นอีก 1 เดือน · ใกล้ครบระบบเตือนทุกคนในร้านเอง</span></div></div>
      <div class="note ok" style="margin-bottom:12px">สร้างแล้วยังแก้ทุกอย่างได้</div>
      ${nav(!busy.adminCreateShop && sc.ok, busy.adminCreateShop ? '<span class="busy">กำลังสร้าง</span>' : 'สร้างร้าน')}`;
  }
  app.innerHTML = h;

  const $ = id => document.getElementById(id);
  const bind = (id, key, ev) => { const el = $(id); if (el) el[ev || 'oninput'] = () => { wz[key] = el.type === 'checkbox' ? el.checked : el.value; saveWz(); if (id === 'wName' || id === 'wOwner') { const nx = $('wzNext'); if (nx) nx.disabled = !okName(); } }; };
  bind('wName', 'name'); bind('wOwner', 'owner'); bind('wEmail', 'email'); bind('wOpen', 'open', 'onchange'); bind('wClose', 'close', 'onchange'); bind('wUntil', 'until', 'onchange');
  // ขั้น 1: ตำแหน่งร้านจากลิงก์ / ตำแหน่งตอนนี้
  wireLoc('wl', (lat, lng) => { wz.lat = lat; wz.lng = lng; wz.gps = ''; saveWz(); if (adm.view === 'wizard') renderWizard(app); toast('ได้ตำแหน่งร้านแล้วน้า~', 'ok', 3000); },
          b => { wz.gps = b; if (adm.view === 'wizard' && wz.step === 1) renderWizard(app); });
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    const i = wz.holidays.indexOf(b.dataset.d);
    if (i >= 0) wz.holidays.splice(i, 1); else wz.holidays.push(b.dataset.d);
    saveWz(); renderWizard(app);
  });
  // ขั้น 2: ประเภท + สวิตช์ + ปรับตัวเลข (พิมพ์แล้วไม่วาดใหม่ ช่องไม่หลุด)
  app.querySelectorAll('[data-type]').forEach(b => b.onclick = () => {
    const t = TYPES.filter(x => x.id === b.dataset.type)[0];
    wz.type = t.id;
    if (t.id !== 'custom') { wz.ot = t.ot; wz.food = t.food; wz.otBaht = t.otBaht; wz.foodBaht = t.foodBaht; }
    saveWz(); renderWizard(app);
  });
  ['ot', 'food', 'fine'].forEach(k => { const el = $('w_' + k); if (el) el.onchange = () => { wz[k] = el.checked; if (!el.checked && wz.tune === k) wz.tune = ''; saveWz(); renderWizard(app); }; });
  app.querySelectorAll('[data-tune]').forEach(b => b.onclick = () => { wz.tune = wz.tune === b.dataset.tune ? '' : b.dataset.tune; saveWz(); renderWizard(app); });
  if (st === 2) {
    if ($('wdSave')) $('wdSave').onclick = () => { wz.ded = readDed('wd', wz.ded || dedStd()).map((x, i) => Object.assign({ day: (wz.ded || dedStd())[i].day }, x)); moreOpen = ''; saveWz(); renderWizard(app); };
    if ($('wdStd')) $('wdStd').onclick = () => { wz.ded = null; moreOpen = ''; saveWz(); renderWizard(app); };
    wireCycle('wc', wz.cyc, soft => { saveWz(); if (!soft) renderWizard(app); }, () => { wz.tune = wz.tune === 'cyc' ? '' : 'cyc'; saveWz(); renderWizard(app); });
    wireShiftEd('ws', wz.sh, soft => {
      saveWz();
      if (!soft) return renderWizard(app);
      const e = shiftEdErr(wz.sh), el = $('wsErr'), nx = $('wzNext'); if (el) el.textContent = e; if (nx) nx.disabled = !!e;
    });
  }
  app.querySelectorAll('[data-num]').forEach(el => el.oninput = () => {
    wz[el.dataset.num] = el.value === '' ? '' : Math.max(0, +el.value); saveWz();
    const so = $('sub_ot'), sf = $('sub_food'), sl = $('sub_fine');
    if (so) so.textContent = otTxt(); if (sf) sf.textContent = `วันละ ${baht(wz.foodBaht)} บาท`; if (sl) sl.textContent = fineTxt();
  });
  // ขั้น 3: การ์ดพนักงาน
  const recheck = () => { const sc = staffCheck(); sc.errs.forEach((e, i) => { const el = $('serr' + i); if (el) el.textContent = e || ''; }); const nx = $('wzNext'); if (nx) nx.disabled = !sc.ok; };
  app.querySelectorAll('[data-f]').forEach(el => {
    const i = +el.dataset.i, f = el.dataset.f;
    if (f === 'name' || f === 'wage') el.oninput = () => { wz.staff[i][f] = el.value; saveWz(); recheck(); };
    if (f === 'manager') el.onchange = () => { wz.staff[i].manager = el.checked; saveWz(); };
    if (f === 'shift') el.onchange = () => { wz.staff[i].shift = el.value; saveWz(); };
    if (f === 'dept') el.onchange = () => {
      if (el.value === '__new') { wz.addDept = true; wz.addDeptFor = i; saveWz(); renderWizard(app); const n = $('wDeptNew'); if (n) n.focus(); return; }
      wz.staff[i].dept = el.value; saveWz();
    };
  });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { wz.staff.splice(+b.dataset.del, 1); saveWz(); renderWizard(app); });
  const add = $('wAdd');
  if (add) add.onclick = () => {
    const last = wz.staff[wz.staff.length - 1];
    wz.staff.push({ name: '', wage: last && last.wage !== '' ? last.wage : '', dept: (last && last.dept) || wz.depts[0], manager: false });
    saveWz(); renderWizard(app);
    const ins = app.querySelectorAll('[data-f="name"]'); if (ins.length) ins[ins.length - 1].focus();
  };
  const dn = $('wDeptAdd');
  if (dn) dn.onclick = () => {
    const v = $('wDeptNew').value.trim().slice(0, 20);
    if (!v) return toast('พิมพ์ชื่อตำแหน่งก่อนนะ', 'bad');
    if (wz.depts.indexOf(v) < 0) wz.depts.push(v);
    if (wz.staff[wz.addDeptFor]) wz.staff[wz.addDeptFor].dept = v;
    wz.addDept = false; saveWz(); renderWizard(app);
  };
  const pa = $('wPaste'); if (pa) pa.oninput = () => { wz.paste = pa.value; saveWz(); };
  const pg = $('wPasteGo');
  if (pg) pg.onclick = () => {
    const p = parsePaste(wz.paste);
    if (p.errs.length) return toast(p.errs.join('\n'), 'bad', 9000);
    if (!p.staff.length) return toast('ยังไม่มีรายชื่อ', 'bad');
    wz.staff = wz.staff.filter(x => String(x.name || '').trim());
    p.staff.forEach(x => { const d = x.dept || wz.depts[0]; if (wz.depts.indexOf(d) < 0) wz.depts.push(d); wz.staff.push({ name: x.name, wage: x.wage, dept: d, manager: false }); });
    wz.paste = ''; moreOpen = ''; saveWz(); renderWizard(app);
    toast(`เติม ${p.staff.length} คนแล้วน้า~`, 'ok', 3000);
  };
  $('wzBack').onclick = () => {
    if (wz.step === 1) { adm = { view: 'home' }; renderAdmin(); loadAdmin(); return; }
    wz.step--; saveWz(); renderWizard(app);
  };
  $('wzNext').onclick = async () => {
    if (wz.step < 4) { wz.step++; saveWz(); renderWizard(app); window.scrollTo(0, 0); return; }
    const sc = staffCheck();
    const res = await act('adminCreateShop', { name: wz.name.trim(), owner: wz.owner.trim(), ownerEmail: (wz.email || '').trim(), lat: wz.lat, lng: wz.lng,
      open: wz.open, close: wz.close, holidays: wz.holidays, type: wz.type, ot: wz.ot, food: wz.food, fine: wz.fine,
      otBaht: wz.otBaht, otFirst: wz.otFirst, otStep: wz.otStep, foodBaht: wz.foodBaht,
      fineBaht: wz.fineBaht, graceMin: wz.graceMin, passFee: wz.passFee,
      staff: sc.list.map(x => Object.assign({}, x, { shift: wz.sh.on ? (x.shift || wz.sh.list[0].name) : '' })), until: wz.until || 'none',
      cycle: wz.cyc.kind, cutDay: wz.cyc.cut, cutDow: wz.cyc.dow, shifts: { on: wz.sh.on, list: wz.sh.on ? wz.sh.list : [] },
      deduct: wz.ded ? wz.ded.map(x => ({ dow: x.dow, v: x.v })) : null });
    if (res && res.ok) {
      adm = { view: 'done', res: Object.assign({ owner: wz.owner.trim() }, res) }; wz = WZ_NEW();
      try { localStorage.removeItem(WZ_KEY); } catch (e) {}
      renderAdmin();
    } else renderWizard(app);
  };
}

function renderDone(app) {
  const r = adm.res, id = r.shop.id;
  app.innerHTML = `
    <div class="card hero" style="background:var(--brand-500);border-color:var(--brand-500)"><div class="hm">${nongSvg('party', 120)}</div>
      <h2 style="margin:4px 0 0;font-size:26px">สร้างร้านเสร็จแล้ว!</h2><div style="font-weight:700">${esc(r.shop.name)}</div></div>
    <div class="card"><div class="row" style="flex-wrap:nowrap;align-items:center;gap:14px"><div class="qr" id="qrBox"></div>
      <div style="min-width:0"><div class="muted" style="font-weight:700">รหัสร้าน</div><div class="bigcode">${esc(id)}</div>
        <div class="muted" style="font-weight:700;margin-top:6px">รหัส 4 ตัว</div><div class="bigcode" style="font-size:28px">${esc(r.code)}</div></div></div>
      ${r.link ? `<div class="row" style="margin-top:12px"><input value="${esc(r.link)}" readonly style="flex:1" id="dLink"><button class="small-btn" id="dCopy">ก๊อปลิงก์</button></div>` : '<div class="note warn">ยังไม่ได้ตั้ง LIFF_ID — ลิงก์ยังสร้างไม่ได้</div>'}</div>
    <div class="card"><h2>เหลืออีก 3 อย่าง (ทำในไลน์ ไม่ต้องเขียนโค้ด)</h2>
      <div class="ck"><b class="n">1</b><div>เชิญบอท <b>โคตรพร้อม</b> เข้ากลุ่มไลน์ของร้าน</div></div>
      <div class="ck"><b class="n">2</b><div>พิมพ์ในกลุ่ม <code>ผูกร้าน ${esc(id)} ${esc(r.code)}</code></div></div>
      <div class="ck"><b class="n">3</b><div>ส่งลิงก์/QR ให้ทุกคน แตะแล้วเลือกชื่อตัวเอง + ใส่รหัส ${esc(r.code)}<br><span class="muted">เจ้าของร้าน (${esc(adm.res.owner || '')}) ก็ทำแบบเดียวกัน</span></div></div>
      ${r.gps ? '' : '<div class="note warn">ยังไม่มีตำแหน่งร้าน — แตะ "ดูพนักงานของร้านนี้" แล้ววางลิงก์ Google Maps ของร้าน (ทำที่ไหนก็ได้)</div>'}
      ${r.until ? `<div class="note ok">ค่าบริการครบกำหนด ${dmy(r.until)} · ใกล้ครบระบบเตือนทุกคนในร้านเอง</div>` : ''}</div>
    <button class="btn quiet" id="dShop">ดูพนักงานของร้านนี้</button><div class="gap"></div>
    <button class="btn quiet" id="dHome">กลับหน้าร้านทั้งหมด</button>`;
  drawQr(document.getElementById('qrBox'), r.link);
  const c = document.getElementById('dCopy'); if (c) c.onclick = () => copyText(r.link);
  document.getElementById('dShop').onclick = () => { adm = { view: 'shop', shop: id }; keepShop(); renderAdmin(); loadAdmin(); };
  document.getElementById('dHome').onclick = () => { adm = { view: 'home' }; renderAdmin(); loadAdmin(); };
}

let admOpen = '', admLocBusy = '';
function renderAdmShop(app) {
  const r = admData.shop;
  if (!r) { app.innerHTML = loadingHtml(); return; }
  if (!r.ok) { app.innerHTML = `<div class="card"><div class="note bad">${esc(r.error || r.text)}</div></div><button class="btn quiet" id="sBack">กลับ</button>`; document.getElementById('sBack').onclick = () => { adm = { view: 'home' }; renderAdmin(); loadAdmin(); }; return; }
  const sh = r.shop, closed = sh.status === 'ปิด', bill = r.billing || {};
  paySetInit('ap', r, sh.id);
  const depts = ['หน้าร้าน', 'ครัว', 'แคชเชียร์'].concat(r.depts || []).filter((x, i, a) => x && a.indexOf(x) === i);
  const emps = r.staff.map((e, i) => {
    const open = admOpen === e.name;
    const pill = e.left ? '<span class="pill">ออกแล้ว</span>' : e.bound ? '<span class="pill ok">ผูกเครื่องแล้ว</span>' : '<span class="pill warn">ยังไม่ผูก</span>';
    return `<div class="item" style="flex-wrap:wrap${e.left ? ';opacity:.6' : ''}"><div class="main"><div class="name">${esc(e.name)}${e.role ? ` <span class="pill">${esc(e.role)}</span>` : ''}</div>
      <div class="sub">${esc(e.dept || '-')} · ${baht(e.wage)} บ./วัน</div></div>${pill}
      <button class="small-btn ghost" data-eo="${esc(e.name)}">${open ? 'ปิด' : 'แก้'}</button>
      ${open ? `<div class="mbox" style="width:100%">
        <div class="row mrow"><span class="mlabel">ค่าแรง/วัน</span><input type="number" id="eW${i}" value="${e.wage}" style="width:110px"><button class="small-btn" data-ew="${i}">บันทึก</button></div>
        <div class="row mrow"><span class="mlabel">ตำแหน่ง</span><input id="eD${i}" value="${esc(e.dept)}" style="width:130px" maxlength="20"><button class="small-btn" data-ed="${i}">บันทึก</button></div>
        ${deptPick('eD' + i, e.dept, depts)}
        ${r.shiftOn && String(e.role).indexOf('เจ้าของ') < 0 ? `<div class="row mrow"><span class="mlabel">กะประจำ</span><select id="eS${i}" style="width:130px">${r.shifts.map(x => `<option ${x.name === e.shift ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select><button class="small-btn" data-es="${i}">บันทึก</button></div>` : ''}
        ${String(e.role).indexOf('เจ้าของ') >= 0 ? '' : `<div class="row mrow"><span class="mlabel">สิทธิ์ผู้จัดการ</span><button class="small-btn ${e.role === 'ผู้จัดการ' ? 'ghost' : ''}" data-er="${i}">${e.role === 'ผู้จัดการ' ? 'ถอดผู้จัดการ' : 'ตั้งเป็นผู้จัดการ'}</button></div>`}
        <div class="more">${moreBtn('ae', 'เพิ่มเติม')}</div>
        ${moreBox('ae', (e.bound ? `<div class="row mrow" style="margin-top:0"><span class="mlabel">ย้ายเครื่อง (ปลดเครื่องเดิม)</span><button class="small-btn red" data-eu="${i}">${armed === 'eu' + i ? 'แตะอีกครั้ง' : 'ปลด'}</button></div>` : '') +
          `<div class="row mrow"><span class="mlabel">${e.left ? 'กลับมาทำงาน' : 'ให้ออก (เก็บประวัติไว้)'}</span><button class="small-btn ${e.left ? '' : 'red'}" data-el="${i}">${armed === 'el' + i ? 'แตะอีกครั้ง' : e.left ? 'กลับมา' : 'ให้ออก'}</button></div>`)}
      </div>` : ''}</div>`;
  }).join('');
  app.innerHTML = `
    <div class="card"><div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div style="flex:1;min-width:0"><h2 style="margin:0">${esc(sh.name)}</h2>
      <div class="muted">รหัสร้าน <b>${esc(sh.id)}</b> · รหัส 4 ตัว <b>${esc(r.code)}</b></div>
      <div style="margin-top:6px">${closed ? '<span class="pill bad">ปิดอยู่</span>' : '<span class="pill ok">ใช้งาน</span>'} ${sh.group ? '<span class="pill ok">ผูกกลุ่มแล้ว</span>' : '<span class="pill warn">ยังไม่ผูกกลุ่ม</span>'}</div></div>
      <div class="qr" id="qrBox" style="width:112px;height:112px"></div></div>
      ${r.link ? `<div class="row" style="margin-top:10px"><input value="${esc(r.link)}" readonly style="flex:1" id="sLink"><button class="small-btn" id="sCopy">ก๊อป</button></div>` : ''}
      ${sh.group ? '' : `<div class="note warn">ยังไม่ผูกกลุ่ม: เชิญบอทเข้ากลุ่มร้าน แล้วพิมพ์ <b>ผูกร้าน ${esc(sh.id)} ${esc(r.code)}</b></div>`}</div>
    ${r.gps ? '' : `<div class="card"><h2>ตำแหน่งร้าน</h2><div class="note bad" style="margin:0 0 10px">ยังไม่ได้ตั้ง — พนักงานยังเข้างานไม่ได้</div>${locBox('al', null, admLocBusy)}</div>`}
    ${bill.state && bill.state !== 'ok' ? `<div class="card"><div class="note ${bill.state === 'due' ? 'warn' : 'bad'}" style="margin:0">${bill.state === 'locked' ? 'พักระบบอยู่ (ค้างชำระ)' : bill.state === 'overdue' ? 'เลยกำหนดชำระแล้ว · พักระบบวันที่ ' + dmy(bill.lockOn) : 'ใกล้ครบกำหนด · เหลือ ' + bill.daysLeft + ' วัน'}</div>
      ${r.creator ? '<button class="btn" id="sRenew2" style="margin:12px 0 0">รับเงินแล้ว ต่อ 1 เดือน</button>' : ''}</div>` : ''}
    <div class="card"><h2>เพิ่มพนักงาน</h2>
      <div class="srow" style="margin:0"><div class="r"><input class="n" id="nName" placeholder="ชื่อเล่น" maxlength="20"><input class="w" id="nWage" type="number" inputmode="numeric" placeholder="บาท/วัน"></div>
        <div class="r" style="flex-wrap:wrap">${deptPick('nDept', 'หน้าร้าน', depts)}</div>
        <div class="r"><input class="d" id="nDept" value="หน้าร้าน" placeholder="หรือพิมพ์ตำแหน่งใหม่" maxlength="20"><label class="chk"><input type="checkbox" id="nMgr">ผู้จัดการ</label></div>
        ${r.shiftOn ? `<div class="r"><span class="muted" style="font-size:15px;flex:none">กะประจำ</span><select class="d" id="nShift">${r.shifts.map(x => `<option>${esc(x.name)}</option>`).join('')}</select></div>` : ''}</div>
      <button class="btn quiet" id="nAdd" style="margin:10px 0 0">＋ เพิ่มพนักงาน</button>
      </div>
    <div class="card"><h2>พนักงาน ${r.staff.filter(e => !e.left).length} คน</h2><div class="list">${emps || '<div class="muted">ยังไม่มีพนักงาน</div>'}</div></div>
    <div class="more center">${moreBtn('as', (r.creator ? 'ค่าบริการ · ' : '') + 'รอบจ่าย · กะ · ปิดร้าน')}</div>
    ${moreBox('as', paySetHtml('ap', r) + (r.creator ? `<div class="card"><h2>ค่าบริการรายเดือน</h2>
      <div class="muted">${sh.until ? 'ครบกำหนด ' + dmy(sh.until) : 'ไม่มีวันหมดอายุ'}</div>
      <button class="btn" id="sRenew" style="margin:10px 0 12px">รับเงินแล้ว ต่อ 1 เดือน<small>${sh.until ? 'ยังไม่ครบ = ต่อจากวันเดิม · เลยแล้ว = นับจากวันนี้' : 'เริ่มนับจากวันนี้'}</small></button>
      <div class="row"><span style="flex:1;font-weight:700">หรือตั้งวันเอง</span><input type="date" id="sUntil" value="${esc(sh.until)}"><button class="small-btn" id="sUntilGo">บันทึก</button></div></div>` : '') + `
      ${r.gps ? `<div class="card"><h2>ตำแหน่งร้าน</h2>${locBox('al', r.gps, admLocBusy)}</div>` : ''}
      <div class="card"><h2>📧 ไฟล์ร้านไป Drive เจ้าของ</h2><div class="muted" style="font-size:16px">${r.ownerEmail ? 'ส่งให้ ' + esc(r.ownerEmail) + ' แล้ว · ส่งซ้ำได้' : 'แชร์ไฟล์ชีตร้าน (และรูปเข้างาน) ให้ Gmail ของเจ้าของ'}</div>
        <div class="row" style="margin-top:8px"><input id="sMail" type="email" inputmode="email" value="${esc(r.ownerEmail || '')}" placeholder="owner@gmail.com" style="flex:1"><button class="small-btn" id="sMailGo">ส่ง</button></div></div>
      <div class="card"><h2>การใช้งาน</h2>
      <button class="btn quiet${armed === 'sClose' ? ' confirm' : ''}" id="sClose" style="margin:0">${armed === 'sClose' ? 'แตะอีกครั้ง ยืนยัน' : closed ? 'เปิดใช้งานร้านอีกครั้ง' : 'ปิดการใช้งานร้าน'}<small>${closed ? 'พนักงานกลับมาใช้ได้ทันที' : 'พนักงานร้านนี้จะใช้ไม่ได้ (ข้อมูลยังอยู่)'}</small></button></div>`)}
    <div class="gap"></div>
    <button class="btn quiet" id="sBack">กลับหน้าร้านทั้งหมด</button>`;
  drawQr(document.getElementById('qrBox'), r.link);
  const $ = id => document.getElementById(id);
  const edit = async (body, keepOpen) => { const res = await act('adminStaffEdit', Object.assign({ shop: sh.id }, body)); if (res && res.ok) { if (!keepOpen) admOpen = ''; loadAdmin(); } };
  const cp = $('sCopy'); if (cp) cp.onclick = () => copyText(r.link);
  $('sBack').onclick = () => { adm = { view: 'home' }; renderAdmin(); loadAdmin(); };
  wireDeptPick(app);
  $('nAdd').onclick = () => {
    const name = $('nName').value.trim(), wage = $('nWage').value;
    if (!name || /\s/.test(name)) return toast('ใส่ชื่อเล่นคำเดียวก่อนนะ', 'bad');
    if (wage === '') return toast('ใส่เงินต่อวันด้วยนะ', 'bad');
    edit({ op: 'add', name, wage: +wage, dept: $('nDept').value.trim(), manager: $('nMgr').checked, shift: $('nShift') ? $('nShift').value : '' });
  };
  app.querySelectorAll('[data-er]').forEach(b => b.onclick = () => { const e = r.staff[+b.dataset.er]; edit({ op: 'role', name: e.name, manager: e.role !== 'ผู้จัดการ' }, true); });
  const renew = async () => { const res = await act('adminSetShop', { shop: sh.id, renew: 1 }); if (res && res.ok) loadAdmin(); };
  if ($('sRenew')) $('sRenew').onclick = renew;
  if ($('sRenew2')) $('sRenew2').onclick = renew;
  wireLoc('al', async (lat, lng) => { const res = await act('adminSetShop', { shop: sh.id, lat, lng }); if (res && res.ok) loadAdmin(); },
          b => { admLocBusy = b; renderAdmShop(app); });
  app.querySelectorAll('[data-eo]').forEach(b => b.onclick = () => { admOpen = admOpen === b.dataset.eo ? '' : b.dataset.eo; renderAdmShop(app); });
  app.querySelectorAll('[data-ew]').forEach(b => b.onclick = () => { const e = r.staff[+b.dataset.ew]; edit({ op: 'wage', name: e.name, wage: +$('eW' + b.dataset.ew).value }, true); });
  app.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => { const e = r.staff[+b.dataset.ed]; edit({ op: 'dept', name: e.name, dept: $('eD' + b.dataset.ed).value }, true); });
  app.querySelectorAll('[data-es]').forEach(b => b.onclick = () => { const e = r.staff[+b.dataset.es]; edit({ op: 'shift', name: e.name, shift: $('eS' + b.dataset.es).value }, true); });
  wirePaySet('ap', () => renderAdmShop(app),
    async b => { const res = await act('adminSetShop', Object.assign({ shop: sh.id }, b)); if (res && res.ok) { moreOpen = 'as'; loadAdmin(); } return res && res.ok; },
    async b => { const res = await act('adminSetShop', { shop: sh.id, shifts: b }); if (res && res.ok) { moreOpen = 'as'; loadAdmin(); } return res && res.ok; });
  app.querySelectorAll('[data-eu]').forEach(b => b.onclick = () => twoTap('eu' + b.dataset.eu, () => edit({ op: 'unbind', name: r.staff[+b.dataset.eu].name })));
  app.querySelectorAll('[data-el]').forEach(b => b.onclick = () => twoTap('el' + b.dataset.el, () => { const e = r.staff[+b.dataset.el]; edit({ op: e.left ? 'back' : 'leave', name: e.name }); }));
  if ($('sMailGo')) $('sMailGo').onclick = async () => { const res = await act('adminSetShop', { shop: sh.id, ownerEmail: $('sMail').value.trim() }); if (res && res.ok) loadAdmin(); };
  if ($('sUntilGo')) $('sUntilGo').onclick = async () => { const res = await act('adminSetShop', { shop: sh.id, until: $('sUntil').value }); if (res && res.ok) loadAdmin(); };
  if ($('sClose')) $('sClose').onclick = () => twoTap('sClose', async () => { const res = await act('adminSetShop', { shop: sh.id, status: closed ? 'ใช้งาน' : 'ปิด' }); if (res && res.ok) loadAdmin(); });
}
</script>
</body>
</html>
