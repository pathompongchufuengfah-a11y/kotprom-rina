<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>โคตรพร้อม เข้างาน</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Noto+Sans+Thai+Looped:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ธีมโคตรพร้อม: ส้มนำ ขาวรอง · ฟอนต์ไทยมีหัว · ปุ่มใหญ่กดยุบ · สีเขียว/เหลือง/แดงใช้บอกความหมายเท่านั้น
     (ทุกร้านใช้ธีมเดียวกัน เปลี่ยนแค่ชื่อร้านที่หัวจอ) */
  :root {
    --bg: #FFF9F3; --card: #ffffff; --ink: #21140D; --muted: #5E4B3F; --line: #F0E2D5;
    --brand: #EA580C; --brand-ink: #C2410C; --brand-edge: #9A3412; --brand-soft: #FFE8D4; --brand-50: #FFF5EC; --brand-500: #F97316;
    --ok: #157A3A; --ok-soft: #E2F7E8; --warn: #8A5A00; --warn-soft: #FFF2CC;
    --bad: #B42318; --bad-soft: #FDE7E4; --night: #21140D;
    --r: 26px; --shadow: 0 2px 0 #F0E2D5, 0 12px 24px -14px rgba(124,45,18,.22);
    --display: "Mali", "Noto Sans Thai Looped", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans Thai Looped", "Sukhumvit Set", "Leelawadee UI", sans-serif;
    font-size: 19px; line-height: 1.55; }
  body { padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
  .num { font-variant-numeric: tabular-nums; }
  .sync { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 50; background: #fff; color: var(--muted); border: 2px solid var(--line);
    border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow); }
  .sync[hidden] { display: none; }
  .dedt { display: grid; grid-template-columns: 34px repeat(5, minmax(0, 1fr)); gap: 4px; align-items: center; }
  .dedt .h { font-size: 11.5px; line-height: 1.25; color: var(--muted); text-align: center; font-weight: 600; }
  .dedt .d { font-weight: 700; font-size: 15px; }
  .dedt input { width: 100%; min-width: 0; padding: 8px 2px; text-align: center; font-size: 16px; }

  header { padding: 18px 20px 6px; max-width: 560px; margin: 0 auto; display: flex; align-items: flex-end; gap: 12px; }
  header .who { flex: 1; min-width: 0; }
  header .shop { color: var(--muted); font-size: 15px; font-weight: 500; }
  header .mark { width: 48px; height: 48px; border-radius: 50%; background: var(--brand-500); display: grid; place-items: center; flex: none; align-self: center; }
  header h1 { font-family: var(--display); margin: 0; font-size: 26px; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .date { background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 15px; font-weight: 600; box-shadow: var(--shadow); white-space: nowrap; }
  main { padding: 10px 16px 0; max-width: 560px; margin: 0 auto; }

  .card { background: var(--card); border-radius: var(--r); padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card { border: 2px solid var(--line); }
  .card h2 { font-family: var(--display); margin: 0 0 10px; font-size: 21px; font-weight: 700; }
  .muted { color: var(--muted); font-size: 16px; }
  .center { text-align: center; }

  /* การ์ดใหญ่ด้านบน: นาฬิกา + สถานะ */
  .hero { text-align: center; padding: 22px 20px 20px; }
  .hero .hm { line-height: 0; margin-bottom: 6px; }
  .clock { font-family: var(--display); font-size: 64px; font-weight: 700; line-height: 1.05; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 6px 16px;
    border-radius: 999px; background: #f1efea; font-size: 17px; font-weight: 600; }
  .status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #b9b4aa; }
  .status.ok { background: var(--ok-soft); color: var(--ok); } .status.ok::before { background: var(--ok); }
  .status.bad { background: var(--bad-soft); color: var(--bad); } .status.bad::before { background: var(--bad); }
  .status.warn { background: var(--warn-soft); color: var(--warn); } .status.warn::before { background: #e0a100; }
  .result { margin-top: 14px; font-size: 30px; font-weight: 700; }
  .result small { display: block; font-size: 16px; font-weight: 500; color: var(--muted); }
  .icon { font-size: 52px; line-height: 1.1; }

  /* ปุ่ม */
  button { font: inherit; border: 0; cursor: pointer; touch-action: manipulation; color: inherit; background: none; -webkit-tap-highlight-color: transparent; }
  /* แตะแล้วต้องเห็นว่ากดลงไป: ทุกปุ่มเข้มขึ้น · ปุ่มเล็กยุบลงเหมือนปุ่มใหญ่ */
  button:not([disabled]):active { filter: brightness(.82); }
  .small-btn:not([disabled]):active { transform: translateY(2px); box-shadow: 0 1px 0 var(--brand-edge); }
  .small-btn.ghost:not([disabled]):active, .small-btn.red:not([disabled]):active { box-shadow: 0 1px 0 #FFD0A8; }
  .btn.quiet:active { box-shadow: 0 1px 0 #FFD0A8; }
  /* ปุ่มพื้นขาว: กดแล้วเป็นส้มอ่อน (ไม่ใช่เทา) */
  .btn.quiet:not(.confirm):active, .small-btn.ghost:not([disabled]):active, .small-btn.red:not([disabled]):active,
  .seg button:not(.on):active, .dp:not(.on):active, nav.tabs button:active, .more-btn:active { filter: none; background: #FFE3CC; }
  .dp { min-height: 44px; padding: 6px 16px; border-radius: 999px; background: #fff; border: 2px solid var(--line); font-size: 17px; font-weight: 600; }
  .dp.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn { display: block; width: 100%; min-height: 88px; padding: 14px 18px; border-radius: var(--r); margin-bottom: 6px;
    background: var(--brand); color: #fff; font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1.2;
    box-shadow: 0 6px 0 var(--brand-edge); transition: transform .06s, box-shadow .06s; }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--brand-edge); }
  .btn small { display: block; font-family: "Noto Sans Thai Looped", sans-serif; font-size: 18px; font-weight: 600; margin-top: 4px; }
  .btn.green { background: var(--brand); }
  .btn.orange { background: var(--ink); box-shadow: 0 6px 0 #000; }
  .btn.confirm, .btn.quiet.confirm { background: repeating-linear-gradient(-45deg, #B42318 0 18px, #9C1D13 18px 36px); color: #fff; border-color: #B42318; box-shadow: 0 6px 0 #7A1810; }
  .btn.quiet { background: #fff; color: var(--brand-ink); border: 3px solid #FFD0A8; box-shadow: 0 6px 0 #FFD0A8;
    min-height: 66px; font-size: 22px; }
  .btn.quiet small { font-size: 16px; color: var(--muted); }
  .btn.quiet.confirm small { color: #fff; }
  .btn[disabled] { opacity: .45; box-shadow: none; }
  .hint { display: block; width: fit-content; margin: 12px auto 0; padding: 6px 16px; border-radius: 999px;
    background: var(--ok-soft); color: var(--ok); font-size: 17px; font-weight: 600; }
  .small-btn { min-height: 48px; padding: 8px 18px; border-radius: 16px; background: var(--brand); color: #fff; font-size: 17px; font-weight: 700; box-shadow: 0 3px 0 var(--brand-edge); }
  .small-btn.ghost { background: #fff; color: var(--brand-ink); border: 2px solid #FFD0A8; box-shadow: 0 3px 0 #FFD0A8; }
  .small-btn.green { background: var(--brand); } .small-btn.red { background: #fff; color: var(--bad); border: 2px solid #f3c4bf; box-shadow: 0 3px 0 #f3c4bf; }
  .gap { height: 18px; }

  /* คนที่ยังอยู่ */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 6px 14px; border-radius: 999px; background: var(--brand-soft); color: #9a3412; font-weight: 600; font-size: 17px; }
  .chip.grey { background: #f1efea; color: var(--muted); font-weight: 500; }
  .note { border-radius: 16px; padding: 12px 16px; margin-top: 12px; font-size: 17px; }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .note.ok { background: var(--ok-soft); color: var(--ok); }
  .note.bad { background: var(--bad-soft); color: var(--bad); }

  /* แถบเมนูล่าง */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; gap: 4px;
    background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
  nav.tabs button { flex: 1; max-width: 140px; min-height: 64px; border-radius: 20px; font-size: 15px; font-weight: 700; color: var(--muted); }
  nav.tabs button svg { display: block; margin: 0 auto 2px; width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  nav.tabs button.on { background: var(--brand-soft); color: var(--brand-edge); }

  /* ตัวเลือก */
  .seg { display: flex; gap: 8px; margin-bottom: 14px; }
  .seg button { flex: 1; min-width: 0; min-height: 52px; border-radius: 14px; background: #fff; border: 2px solid var(--line); font-size: 17px; font-weight: 600; padding: 6px 2px; white-space: nowrap; }
  .seg button.on { border-color: var(--brand); background: var(--brand-50); color: var(--brand-edge); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal .dow { text-align: center; font-size: 14px; color: var(--muted); font-weight: 600; }
  .cal button { min-height: 52px; border-radius: 12px; background: #faf9f6; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cal button[disabled] { background: transparent; color: #c9c5bd; text-decoration: line-through; }
  .cal .mon { grid-column: 1 / -1; font-size: 15px; color: var(--muted); font-weight: 600; margin-top: 4px; }

  /* รายการ */
  .list { display: flex; flex-direction: column; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .main { flex: 1; min-width: 0; }
  .item .name { font-weight: 700; font-size: 18px; }
  .item .sub { color: var(--muted); font-size: 15px; }
  .item .amt { text-align: right; font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
  .item .amt small { display: block; font-weight: 500; font-size: 14px; color: var(--muted); }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; padding-top: 12px; border-top: 2px solid var(--line); font-weight: 700; font-size: 22px; }
  .pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; background: #f1efea; color: var(--muted); }
  .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }

  input, select { font: inherit; font-size: 19px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink); min-height: 52px; max-width: 100%; }
  input:focus, select:focus { outline: none; border-color: var(--brand); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  pre { white-space: pre-wrap; word-break: break-word; font: inherit; font-size: 17px; line-height: 1.7; margin: 0; }

  #toast { position: fixed; left: 12px; right: 12px; bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 9; max-width: 536px; margin: 0 auto;
    display: none; padding: 16px 18px; border-radius: 20px; background: var(--ink); color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  #toast.ok { background: #14532d; } #toast.bad { background: #7f1d1d; } #toast.warn { background: #78350f; }
  #toast pre { font-size: 17px; line-height: 1.6; }
  .cal button i { display: block; font-style: normal; font-size: 12px; font-weight: 600; color: var(--muted); line-height: 1; }
  .cal button.on i { color: #fff; }
  .cal button.pend { background: var(--warn-soft); box-shadow: inset 0 0 0 2px #f0c64a; }
  .cal button.appr { background: var(--ok-soft); color: var(--ok); box-shadow: inset 0 0 0 2px #B7E4C4; }
  .cal button.rej  { background: var(--bad-soft); box-shadow: inset 0 0 0 2px #ef8a80; }
  .cal button.on   { background: var(--brand); color: #fff; box-shadow: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 4px; vertical-align: -1px; }
  .dot.on { background: var(--brand); } .dot.pend { background: #f0c64a; } .dot.appr { background: var(--ok); } .dot.rej { background: #ef8a80; }
  .pill.blue { background: var(--ok-soft); color: var(--ok); }
  .mbox { margin-top: 10px; padding: 12px; border-radius: 20px; background: var(--brand-50); border: 3px solid var(--brand-500); }
  .mbox input[type=time], .mbox select { min-height: 44px; font-size: 17px; padding: 6px 8px; width: 120px; }
  .mrow { margin-top: 10px; flex-wrap: nowrap; }
  .mlabel { flex: 1; min-width: 0; font-weight: 600; font-size: 17px; line-height: 1.3; }
  nav.tabs button { font-size: 13px; padding: 0 2px; }
  /* ---------- หน้ารอโหลด: ชามลาบเด้ง + จุดวิ่ง + การ์ดเงาวิบวับ ---------- */
  .loading { text-align: center; padding: 30px 20px 26px; }
  .loading .bowl { min-height: 76px; line-height: 0; display: inline-block; animation: hop 1.1s cubic-bezier(.3,.7,.4,1) infinite; transform-origin: 50% 100%; }
  .loading .shadow { width: 54px; height: 8px; margin: 2px auto 0; border-radius: 50%; background: rgba(0,0,0,.08); animation: squish 1.1s cubic-bezier(.3,.7,.4,1) infinite; }
  .loading .msg { margin-top: 12px; color: var(--muted); font-size: 17px; font-weight: 600; min-height: 1.6em; }
  .loading .dots span { display: inline-block; width: 8px; height: 8px; margin: 0 3px; border-radius: 50%; background: var(--brand); animation: blink 1.2s infinite ease-in-out; }
  .loading .dots span:nth-child(2) { animation-delay: .15s; } .loading .dots span:nth-child(3) { animation-delay: .3s; }
  .nong .m-body { fill: #fff; stroke: #21140D; stroke-width: 4.5; stroke-linejoin: round; }
  .nong .m-speed { fill: none; stroke: #FDB27A; stroke-width: 6; stroke-linecap: round; }
  .nong .m-cheek { fill: #FDB27A; }
  .nong .m-eye { fill: none; stroke: #21140D; stroke-width: 7.5; stroke-linecap: round; }
  .nong .m-line { fill: none; stroke: #21140D; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
  .nong .m-drop { fill: #8FD3F4; stroke: #21140D; stroke-width: 3; }
  .nong .m-solid { fill: #21140D; stroke: #21140D; stroke-width: 4; stroke-linejoin: round; }
  .skel { height: 64px; border-radius: var(--r); margin-bottom: 14px;
    background: linear-gradient(90deg, #ece9e2 0%, #f8f6f1 40%, #ece9e2 80%); background-size: 300% 100%; animation: shimmer 1.4s infinite linear; }
  .skel.s2 { height: 120px; } .skel.s3 { height: 88px; opacity: .7; }
  @keyframes hop { 0%,100% { transform: translateY(0) scale(1.06,.94); } 45% { transform: translateY(-22px) scale(.96,1.04) rotate(-6deg); } 60% { transform: translateY(-22px) rotate(6deg); } }
  @keyframes squish { 0%,100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.55); opacity: .5; } }
  button.sending { opacity: .75; cursor: progress; }
  button.sending::after { content: ''; display: inline-block; width: .8em; height: .8em; margin-left: 8px; vertical-align: -1px;
    border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 0%,80%,100% { transform: scale(.6); opacity: .35; } 40% { transform: scale(1); opacity: 1; } }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  .btn[disabled] .busy::after, .small-btn[disabled] .busy::after { content: '…'; display: inline-block; width: 1.2em; text-align: left; animation: blink 1.2s infinite; }
  .icon.pulse { display: inline-block; animation: hop 1.1s cubic-bezier(.3,.7,.4,1) infinite; }
  /* ---------- ปุ่ม ⋯ : ซ่อนปุ่มที่ไม่ค่อยใช้ ---------- */
  .more { display: flex; justify-content: flex-end; margin-top: 10px; }
  .more.center { justify-content: center; }
  .more-btn { min-width: 48px; min-height: 48px; padding: 0 14px; border-radius: 24px; background: #fff; border: 2px solid var(--line);
    color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 700; }
  .more-btn svg { width: 24px; height: 24px; fill: currentColor; flex: none; }
  .more-btn.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-edge); }
  .more-box { margin-top: 10px; padding: 12px; border-radius: 20px; background: #fff; border: 2px dashed #FFD0A8; animation: morein .15s ease-out; }
  .more-box > .card:last-child { margin-bottom: 0; }
  @keyframes morein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  /* ---------- แถบเตือนค่าบริการ ---------- */
  #bill { max-width: 560px; margin: 4px auto 0; padding: 0 16px; }
  #bill .bar { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 20px; font-weight: 700; font-size: 17px; line-height: 1.4; }
  #bill .bar.due { background: var(--warn-soft); color: var(--warn); border: 2px solid #F4DE9C; }
  #bill .bar.overdue { background: var(--bad-soft); color: var(--bad); border: 2px solid #F5C2BB; }
  #bill .bar small { display: block; font-weight: 600; font-size: 15px; }
  /* ---------- ตำแหน่งร้าน (ลิงก์ Google Maps) ---------- */
  .loc { display: flex; flex-direction: column; gap: 8px; }
  .loc .map { width: 100%; height: 170px; border: 0; border-radius: 16px; background: var(--brand-50); }
  .loc .help { font-size: 15px; color: var(--muted); line-height: 1.45; }
  /* ---------- wizard: ปรับตัวเลข + การ์ดพนักงาน ---------- */
  .tune-btn { min-height: 44px; padding: 4px 12px; border-radius: 14px; background: var(--brand-50); color: var(--brand-ink); font-size: 16px; font-weight: 700; border: 2px solid #FFD0A8; }
  .tune { background: var(--brand-50); border-radius: 16px; padding: 12px; margin: 0 0 10px; display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 8px 10px; align-items: center; }
  .tune label { font-weight: 600; font-size: 16px; line-height: 1.3; }
  .tune input { width: 100%; min-height: 48px; text-align: right; }
  /* กะ: สีต่อกะ (ลำดับในรายการ) · หยุด = เทา */
  .sft { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; min-width: 0; padding: 0 2px; border-radius: 12px;
    border: 0; font-family: var(--display); font-weight: 700; font-size: 14px; line-height: 1.1; background: #f1efea; color: var(--muted); }
  .sft.c0 { background: #FFE9A8; color: #5C4300; } .sft.c1 { background: #FFD3B0; color: #7A3300; } .sft.c2 { background: #E3D5FF; color: #3D2A7A; }
  .sft.c3 { background: #CFEFFF; color: #00476B; } .sft.c4 { background: #D4F5D9; color: #0D5A1C; } .sft.c5 { background: #FFD6E7; color: #7A1440; }
  .sft.c6 { background: #E8E1D9; color: #4A3B30; } .sft.c7 { background: #D9F2EE; color: #0B5146; }
  .sft.off { background: #fff; color: #9C8A7E; border: 2px dashed #E3CDBA; }
  .sft.na { background: transparent; color: #C9B8AA; }
  .sgrid { width: 100%; border-collapse: separate; border-spacing: 3px; table-layout: fixed; }
  .sgrid th { font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.2; padding: 0 0 2px; }
  .sgrid th b { display: block; font-size: 16px; color: var(--ink); }
  .sgrid th.today b { color: var(--brand-ink); }
  .sgrid td { padding: 0; text-align: center; }
  .sgrid td .sft { width: 100%; }
  .sgrid .nm { width: 64px; text-align: left; }
  .sgrid .nm button { width: 100%; min-height: 40px; border: 0; background: none; padding: 0 2px; font-family: inherit; font-size: 15px; font-weight: 700;
    text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); border-radius: 10px; }
  .sgrid .nm button.on { background: var(--brand-soft); color: var(--brand-ink); }

<script>
'use strict';
// ★ วางไฟล์นี้บนเว็บอื่น (เช่น GitHub Pages): แก้แค่ API_URL บรรทัดเดียว = URL ของสคริปต์ (…/exec)
//   LIFF ID ไม่ต้องใส่ในไฟล์นี้ — หน้าเว็บถามจากเซิร์ฟเวอร์เอง (อยู่ใน Script Properties ชื่อ LIFF_ID)
//   ทุกร้านใช้ไฟล์นี้ไฟล์เดียว · ลิงก์ของแต่ละร้าน = https://liff.line.me/<LIFF_ID>?shop=<รหัสร้าน>
const API_URL = 'https://script.google.com/macros/s/AKfycbxmRuZjAQFjxNv9OUOeixbbtCI7shC8x6fxKtGovCJioD_8QRnFakMxwuEQL2tmVVrj/exec';
let LIFF_ID = '__LIFF_ID__';   // เปิดผ่าน URL ของ Apps Script ระบบเติมให้ · เว็บอื่นปล่อยไว้แบบนี้ได้

const ST_WORK = 'มาทำงาน';
const DOW = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
const MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const MON_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

let S = null;            // สถานะล่าสุดจากเซิร์ฟเวอร์
const APP_V = '2026-11-01c';   // รุ่นหน้าแอป — ขึ้นท้ายจอ ไว้เช็คว่าอัปไฟล์ใหม่ขึ้น GitHub แล้วจริง (แก้ทุกครั้งที่ปล่อยรุ่นใหม่)
/** ป้ายท้ายจอ: รุ่นหน้าแอป + เปิดจากที่ไหน (กลุ่ม = กดเข้างานแล้วแจ้งกลุ่มเองได้) */
function appFoot() {
  let t = '';
  try { t = (liff.getContext() || {}).type || ''; } catch (e) {}
  const where = { group: 'กลุ่ม ✓', room: 'กลุ่ม ✓', utou: 'แชทส่วนตัว', external: 'นอกไลน์', none: 'นอกไลน์' }[t] || (t || 'ไม่ทราบ');
  return `<div class="muted center" style="font-size:12px;margin-top:16px">หน้าแอป ${APP_V} · 📡 เปิดจาก: ${esc(where)}${liffOdd() ? ' · ⚠️ LIFF ไม่ตรง' : ''}</div>`;
}
/** LIFF ที่เปิดอยู่จริง ≠ LIFF ที่ใช้ init → ส่งเข้ากลุ่มไม่ได้ (INVALID_ARGUMENT) · คืน '' ถ้าตรงกัน */
function liffOdd() {
  try { const id = (liff.getContext() || {}).liffId; return id && LIFF_ID && id !== LIFF_ID ? `LIFF ที่เปิด ${id} ≠ ที่ใช้ ${LIFF_ID}` : ''; } catch (e) { return ''; }
}
/** ข้อความผิดพลาดจาก LINE แบบเต็ม (รหัส · ข้อความ · LIFF ไม่ตรง) */
function lineErr(e) {
  return [e && e.code, e && e.message, liffOdd()].filter((x, i, a) => x && a.indexOf(x) === i).join(' · ').slice(0, 240);
}
let skew = 0;            // เวลาเซิร์ฟเวอร์ − เวลาเครื่อง
let tab = 'time', bossTab = 'today';
let busy = {};           // ปุ่มที่กำลังบันทึก (ไม่ล็อกหน้าจอ แค่กันกดซ้ำปุ่มเดิม)
let armed = '';          // ปุ่มที่รอแตะยืนยันครั้งที่สอง
let armTimer = null;
let leaveType = 'ลากิจ';
let bossCache = {};
let idToken = '';
let SHOP = shopFromUrl();   // รหัสร้านจากลิงก์ (?shop=) · ไม่มี = ร้านที่เคยเปิดล่าสุดในเครื่องนี้
let NO_SHOP = null;         // คำตอบตอนยังไม่รู้ว่าเป็นร้านไหน
let IS_ADMIN = false;

function shopFromUrl() {
  const clean = v => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  try {
    const q = new URLSearchParams(location.search);
    let v = q.get('shop');
    if (!v && q.get('liff.state')) v = new URLSearchParams(String(q.get('liff.state')).replace(/^[^?]*\?/, '')).get('shop');
    if (v) { localStorage.setItem('kp.shop', clean(v)); return clean(v); }
    return clean(localStorage.getItem('kp.shop'));
  } catch (e) { return ''; }
}
function rememberShop(id) { SHOP = id || ''; try { if (SHOP) localStorage.setItem('kp.shop', SHOP); else localStorage.removeItem('kp.shop'); } catch (e) {} }

// ---------- น้องพร้อม: มาสคอต + คลังคำพูด (คำกลาง ใช้ได้ทุกร้าน) ----------
const NONG_PROM = {
  load:    ['น้องพร้อมวิ่งมาแล้วน้า~', 'แป๊บนึงน้า กำลังเตรียมให้', 'ยืดเส้นยืดสายแป๊บ…', 'พร้อมแล้ว พร้อมลุย!', 'รอแป๊บเดียว จะไวกว่าแสงเลย', 'เกือบเสร็จแล้วน้า~'],
  ok:      ['เก่งมาก!', 'เย้~ เรียบร้อย', 'วันนี้ก็สู้ๆ นะ', 'น้องพร้อมจดให้แล้วน้า'],
  error:   ['อุ๊ย สะดุดนิดนึง แตะอีกทีน้า', 'ไม่เป็นไรน้า ลองใหม่อีกครั้งนะ'],
  offline: ['เน็ตหายไปไหนน้า~ ลองใหม่อีกทีนะ'],
  empty:   ['ยังไม่มีอะไรเลย สบายๆ~']
};
const NONG_MOOD = ['happy', 'search', 'wink', 'search'];
function nong(kind) { const a = NONG_PROM[kind] || NONG_PROM.ok; return a[Math.floor(Math.random() * a.length)]; }
// หน้าตาน้องพร้อม (กล่องแชตจากโลโก้ + เส้นความเร็ว) — ตรงกับแบบในแคนวาสออกแบบ
function nongSvg(mood, size) {
  const M = {
    happy:  ['M70 40v7', 'M94 40v7', 'm-eye', 'M76 56q6 7 12 0', 'm-line'],
    wink:   ['M70 40v7', 'M89 45q5-6 10 0', 'm-eye', 'M75 55q7 10 14 0z', 'm-solid'],
    search: ['M75 38v7', 'M99 38v7', 'm-eye', 'M84 58a3 3 0 1 0 0.1 0', 'm-line'],
    sad:    ['M70 42v6', 'M94 42v6', 'm-eye', 'M75 61q7-7 14 0', 'm-line'],
    sweat:  ['M70 41v6', 'M94 41v6', 'm-eye', 'M75 59q3.5-4 7 0t7 0', 'm-line', '<path class="m-drop" d="M125 12Q133 25 125 31Q117 25 125 12Z"/>'],
    sleepy: ['M64 45q6 4 12 0', 'M88 45q6 4 12 0', 'm-line', 'M79 58q3 2.5 6 0', 'm-line', '<path class="m-line" d="M116 6h9l-9 10h9"/>'],
    party:  ['M64 46q6-7 12 0', 'M88 46q6-7 12 0', 'm-line', 'M74 54q8 12 16 0z', 'm-solid'],
    offline:['M66 40l8 8m0-8l-8 8', 'M90 40l8 8m0-8l-8 8', 'm-line', 'M77 58h10', 'm-line']
  };
  const m = M[mood] || M.happy, w = size || 96;
  return `<svg class="nong" viewBox="0 0 140 110" width="${w}" height="${Math.round(w * 110 / 140)}" aria-hidden="true">
    <path class="m-speed" d="M6 34h18M2 48h20M10 62h12"/>
    <path class="m-body" d="M62 10H102A28 28 0 0 1 130 38V54A28 28 0 0 1 102 82H68L46 101L50 79Q34 72 34 54V38A28 28 0 0 1 62 10Z"/>
    <ellipse class="m-cheek" cx="58" cy="58" rx="6.5" ry="4"/><ellipse class="m-cheek" cx="106" cy="58" rx="6.5" ry="4"/>
    <path class="${m[2]}" d="${m[0]}"/><path class="${m[2]}" d="${m[1]}"/><path class="${m[4]}" d="${m[3]}"/>${m[5] || ''}</svg>`;
}

// ---------- หน้ารอโหลด (น้องพร้อมเด้ง + เปลี่ยนคำพูดเรื่อยๆ ไม่ให้น่าเบื่อ) ----------
let loadTick = 0;
function loadingHtml() {
  return `<div class="loading"><div class="bowl">${nongSvg(NONG_MOOD[loadTick % NONG_MOOD.length])}</div><div class="shadow"></div>
    <div class="msg">${NONG_PROM.load[loadTick % NONG_PROM.load.length]}</div><div class="dots"><span></span><span></span><span></span></div></div>
    <div class="skel s2"></div><div class="skel"></div><div class="skel s3"></div>`;
}
setInterval(function () {        // สลับหน้าตา/คำพูดทุก 1.1 วิ (ตรงจังหวะเด้ง) เฉพาะตอนที่หน้ากำลังรอโหลดอยู่
  const b = document.querySelector('.loading .bowl'), m = document.querySelector('.loading .msg');
  if (!b) return;
  loadTick++;
  b.innerHTML = nongSvg(NONG_MOOD[loadTick % NONG_MOOD.length]);
  m.textContent = NONG_PROM.load[loadTick % NONG_PROM.load.length];
}, 1100);
{ const b0 = document.querySelector('.loading .bowl'); if (b0) b0.innerHTML = nongSvg('happy'); }
document.getElementById('mark').innerHTML = nongSvg('happy', 40);

// ---------- เริ่มต้น ----------
boot();
async function boot() {
  if (API_URL.indexOf('__') === 0) {
    return fatal('ยังไม่ได้ใส่ API_URL ในไฟล์ index.html (ดูคู่มือติดตั้ง ขั้นที่ 9)');
  }
  if (!LIFF_ID || LIFF_ID.indexOf('__') === 0) {
    try { LIFF_ID = localStorage.getItem('kp.liff') || ''; } catch (e) {}   // จำไว้ ไม่ต้องถามเซิร์ฟเวอร์ทุกครั้ง
  }
  if (!LIFF_ID || LIFF_ID.indexOf('__') === 0) {
    try {
      const c = await (await fetch(API_URL + '?config=1')).json();
      LIFF_ID = c.liffId || '';
      try { if (LIFF_ID) localStorage.setItem('kp.liff', LIFF_ID); } catch (e) {}
    } catch (e) {
      return fatal('ติดต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจ API_URL ใน index.html และการ Deploy (คู่มือติดตั้ง ขั้นที่ 6 และ 9)');
    }
    if (!LIFF_ID) return fatal('ยังไม่ได้ใส่ LIFF_ID ใน Script Properties (คู่มือติดตั้ง ขั้นที่ 10)');
  }
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    // LIFF ID ที่จำไว้/จากเซิร์ฟเวอร์ ไม่ตรงกับแอปที่เปิดอยู่จริง → ใช้ตัวที่เปิดจริง (ไม่งั้นส่งเข้ากลุ่มไม่ได้) · รีโหลดครั้งเดียว
    const openId = (liff.getContext() || {}).liffId;
    if (openId && openId !== LIFF_ID) {
      try { localStorage.setItem('kp.liff', openId); } catch (e) {}
      let again = false;
      try { again = sessionStorage.getItem('kp.liffFix') === openId; sessionStorage.setItem('kp.liffFix', openId); } catch (e) { again = true; }
      if (!again) { location.reload(); return; }
    }
    idToken = liff.getIDToken();
    if (!idToken) return fatal('ไม่ได้รับ ID token — ต้องเปิด scope "openid" ในหน้า LIFF ของ LINE Developers');
  } catch (e) {
    try { localStorage.removeItem('kp.liff'); } catch (x) {}   // LIFF ID ที่จำไว้อาจเก่า (สร้าง LIFF ใหม่) → เปิดใหม่จะถามเซิร์ฟเวอร์
    return fatal('เปิด LIFF ไม่สำเร็จ: ' + e.message);
  }
  markReady();
  await refresh(!S);                                   // มีหน้าจอจากเครื่องแล้ว = โหลดพลาดไม่ต้องขึ้นจอแดง
  setSync(false);
  setTimeout(() => { if (S && S.registered && !myText) loadMy(); }, 1500);          // เตรียมแท็บ ของฉัน ไว้ก่อน
  setInterval(() => { if (tab === 'time') renderTime(); }, 15000);                  // ป้ายเงินบนปุ่มเดินตามเวลาจริง
  setInterval(() => { if (!document.hidden && !anyBusy()) refresh(); }, 60000);     // ข้อมูลสดทุก 60 วินาที
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !anyBusy()) refresh(); });
}

// ---------- เปิดเร็ว: วาดจอจากข้อมูลล่าสุดในเครื่องทันที แล้วอัปเดตเบื้องหลัง ----------
// ปุ่มกดได้เลย · คำขอที่กดก่อน LINE พร้อมจะรอ (เวลาที่แตะจดไว้แล้ว) แล้วค่อยส่ง
let markReady = null;
const ready = new Promise(r => { markReady = r; });
function snapKey() { return 'kp.st:' + (SHOP || ''); }
function saveSnap(j) { try { if (SHOP && j && j.ok && j.registered) localStorage.setItem(snapKey(), JSON.stringify(j)); } catch (e) {} }
function loadSnap() {
  try { const j = JSON.parse(localStorage.getItem(snapKey()) || 'null'); return j && j.ok && j.shopId === SHOP ? j : null; }
  catch (e) { return null; }
}
function setSync(on) {
  let el = document.getElementById('sync');
  if (!el) { el = document.createElement('div'); el.id = 'sync'; el.className = 'sync'; document.body.appendChild(el); }
  el.textContent = 'กำลังอัปเดต…';
  el.hidden = !on;
}
// เรียกหลังสคริปต์ทั้งไฟล์โหลดครบ (ฟังก์ชัน/ค่าคงที่ด้านล่างพร้อมใช้) แต่ก่อนเน็ตตอบ
setTimeout(function quickStart() {
  if (S || !SHOP) return;
  const snap = loadSnap();
  if (!snap) return;
  S = snap; skew = 0; IS_ADMIN = !!snap.admin;          // นาฬิกาใช้ของเครื่องไปก่อน รอเวลาจริงจากเซิร์ฟเวอร์
  render(); setSync(true);
}, 0);

function fatal(msg) {
  document.getElementById('app').innerHTML = `<div class="card hero"><div class="hm">${nongSvg('sad', 110)}</div><pre>${esc(msg)}</pre></div>`;
  document.getElementById('who').textContent = 'เปิดไม่สำเร็จ';
}

// ---------- คุยกับเซิร์ฟเวอร์ ----------
async function api(action, extra) {
  await ready;                                         // กดก่อน LINE พร้อม → รอ token (เวลาที่แตะอยู่ใน extra แล้ว)
  const body = JSON.stringify(Object.assign({ action, idToken, shop: SHOP }, extra || {}));
  const res = await fetch(API_URL + '?api=1', { method: 'POST', body });   // text/plain → ไม่ต้อง preflight
  const j = await res.json();
  if (j && j.auth) {
    if (!sessionStorage.getItem('reauth')) { sessionStorage.setItem('reauth', '1'); location.reload(); }
    throw new Error(j.error || 'ยืนยันตัวตนไม่ผ่าน');
  }
  sessionStorage.removeItem('reauth');
  return j;
}

async function refresh(first) {
  try {
    const j = await api('state');
    if (j && j.locked) { IS_ADMIN = !!j.admin; NO_SHOP = j; S = null; if (tab !== 'admin') renderNoShop(); else renderAdmin(); return; }
    if (j && j.noShop) { IS_ADMIN = !!j.admin; NO_SHOP = j; S = null; if (tab !== 'admin') renderNoShop(); else renderAdmin(); return; }
    if (!j.ok) throw new Error(j.error || 'โหลดไม่สำเร็จ');
    NO_SHOP = null;
    setState(j);
  } catch (e) {
    if (first) fatal('โหลดข้อมูลไม่สำเร็จ: ' + e.message + '\nลองปิดแล้วเปิดใหม่');
    else toast('⚠️ เน็ตไม่เสถียร — ตัวเลขอาจยังไม่อัปเดต', 'warn');
  }
}

function setState(j) {
  S = j;
  IS_ADMIN = !!j.admin;
  if (j.shopId && j.shopId !== SHOP) rememberShop(j.shopId);
  skew = j.now - Date.now();
  saveSnap(j);
  render();
}

/**
 * ทำงาน 1 ปุ่ม: เปลี่ยนหน้าจอก่อน แล้วบันทึกเบื้องหลัง
 * rid = รหัสการกดครั้งนี้ · ส่งซ้ำ (เน็ตหลุด/กดใหม่) ใช้ rid เดิม → เซิร์ฟเวอร์บันทึกครั้งเดียว
 */
// ปุ่มที่เพิ่งแตะ → act() ทำให้ขึ้น "กำลังบันทึก…" ทันที ทุกปุ่มโดยไม่ต้องแก้ทีละจุด (จอวาดใหม่ = ปุ่มหายเอง)
let lastTap = null, lastTapAt = 0;
document.addEventListener('click', e => { lastTap = e.target.closest && e.target.closest('button'); lastTapAt = Date.now(); }, true);
function markSending() {
  const b = lastTap;
  if (!b || Date.now() - lastTapAt > 1000 || !b.isConnected || b.classList.contains('sending')) return null;
  const label = b.innerHTML;
  b.classList.add('sending'); b.disabled = true; b.innerHTML = 'กำลังส่ง…';
  return () => { if (b.isConnected) { b.classList.remove('sending'); b.disabled = false; b.innerHTML = label; } };
}

async function act(action, extra, optimistic) {
  if (busy[action]) { toast('⏳ กำลังส่งอยู่ รอแป๊บนะ', 'warn', 2500); return null; }
  const rid = pendingRid(action);
  busy[action] = true;
  const unmark = optimistic ? null : markSending();   // เปลี่ยนจอทันทีอยู่แล้ว ไม่ต้องหมุนที่ปุ่ม
  const before = S ? JSON.parse(JSON.stringify(S)) : null;
  if (optimistic && S) { optimistic(S); render(); }
  let res = null, lastErr = null;
  for (let i = 0; i < 3 && !res; i++) {
    try { res = await api(action, Object.assign({ rid }, extra || {})); }
    catch (e) { lastErr = e; await sleep(1000 * (i + 1) * (i + 1)); }
  }
  busy[action] = false;
  if (unmark) unmark();
  if (!res) {
    if (before) S = before;
    render();
    toast('📶 ' + nong('offline') + '\nกดปุ่มเดิมอีกครั้งได้เลย ระบบจะไม่บันทึกซ้ำ\n(' + (lastErr ? lastErr.message : '') + ')', 'bad', 9000);
    return null;
  }
  clearPending(action);
  if (res.ok && action !== 'setSetting' && action !== 'setRole') moreOpen = '';
  if (res.state && res.state.ok) setState(res.state); else render();
  if (res.text) toast(res.text + '\n' + (res.ok ? nong('ok') : nong('error')), res.ok ? 'ok' : 'bad', res.ok ? 6000 : 9000);
  else if (res.error) toast(res.error, 'bad', 9000);
  if (res.ok && res.share) shareToGroup(res.share, res.shareCard);
  return res;
}

function pendingRid(action) {
  const k = 'rid:' + action;
  try {
    const p = JSON.parse(localStorage.getItem(k) || 'null');
    if (p && Date.now() - p.at < 10 * 60000) return p.rid;
  } catch (e) {}
  const rid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/[^\w-]/g, '');
  try { localStorage.setItem(k, JSON.stringify({ rid, at: Date.now() })); } catch (e) {}
  return rid;
}
function clearPending(action) { try { localStorage.removeItem('rid:' + action); } catch (e) {} }
function anyBusy() { return Object.keys(busy).some(k => busy[k]); }
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- ตัวช่วย ----------
function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function nowMs() { return Date.now() + skew; }
function hhmm(ms) {
  return new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(ms));
}
function baht(n) { return Number(n || 0).toLocaleString('th-TH'); }

/** สูตรเดียวกับเซิร์ฟเวอร์ (otRounds) — ใช้แสดงผลเท่านั้น ตัวเลขจริงคิดที่เซิร์ฟเวอร์ตอนกด */
function otView(t) {
  const o = S.ot, over = Math.floor((t - o.std) / 60000);
  const rounds = over < o.first ? 0 : 1 + Math.floor((over - o.first) / o.step);
  const nextAt = o.std + (rounds === 0 ? o.first : o.first + rounds * o.step) * 60000;
  return { over, rounds, money: rounds * o.rate, beforeStd: t < o.std,
           waitMin: Math.ceil((nextAt - t) / 60000), warn: over >= o.first && S.staying.length > o.keep };
}

function toast(text, kind, ms) {
  const el = document.getElementById('toast');
  el.className = kind || '';
  el.innerHTML = `<pre>${esc(text)}</pre>`;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, ms || 6000);
  el.onclick = () => { el.style.display = 'none'; };
}

/** ปุ่มอันตราย: แตะครั้งแรก = ขอยืนยัน · แตะครั้งที่สองภายใน 6 วินาที = ทำจริง (ห้ามใช้ confirm()) */
function twoTap(id, fn) {
  if (armed === id) { armed = ''; clearTimeout(armTimer); fn(); return; }
  armed = id;
  clearTimeout(armTimer);
  armTimer = setTimeout(() => { armed = ''; render(); }, 6000);
  render();
}

// ---------- แถบเตือนค่าบริการรายเดือน (ทุกคนในร้านเห็น) ----------
function dmy(k) { return k ? `${+k.slice(8)}/${+k.slice(5, 7)}/${String(+k.slice(0, 4) + 543).slice(2)}` : ''; }
function renderBill() {
  const el = document.getElementById('bill'), b = S && S.billing;
  if (!b || tab === 'admin' || (b.state !== 'due' && b.state !== 'overdue')) { el.hidden = true; el.innerHTML = ''; return; }
  const head = b.state === 'due'
    ? `ค่าบริการโคตรพร้อมครบกำหนด ${dmy(b.due)} · ${b.daysLeft === 0 ? 'วันนี้' : 'เหลือ ' + b.daysLeft + ' วัน'}`
    : `เลยกำหนดชำระค่าบริการแล้ว · ระบบจะพักวันที่ ${dmy(b.lockOn)}`;
  el.hidden = false;
  el.innerHTML = `<div class="bar ${b.state}">${nongSvg(b.state === 'due' ? 'sweat' : 'sad', 44)}<div>${esc(head)}
    <small>${b.fee ? 'ค่าบริการ ' + esc(b.fee) + ' บาท/เดือน · ' : ''}${b.pay ? 'ชำระที่ ' + esc(b.pay) : 'แจ้งเจ้าของร้านให้ชำระนะ'}</small></div></div>`;
}

/**
 * ช่องตั้งตำแหน่งร้าน: วางลิงก์ Google Maps / พิมพ์พิกัด (ทำที่ไหนก็ได้) หรือกด "ใช้ตำแหน่งตอนนี้" (ต้องอยู่ที่ร้าน)
 * ใช้ใน wizard, ตั้งค่าเจ้าของ, หน้าแอดมิน
 */
function locBox(p, cur, busyTxt) {
  const map = cur ? `<iframe class="map" title="แผนที่ร้าน" loading="lazy" src="https://maps.google.com/maps?q=${+cur.lat},${+cur.lng}&z=17&output=embed"></iframe>
      <div class="note ok" style="margin:0">ได้ตำแหน่งร้านแล้ว · ดูหมุดในแผนที่ว่าตรงร้านไหม</div>` : '';
  return `<div class="loc">${map}
    <div class="row" style="flex-wrap:nowrap"><input id="${p}Link" placeholder="วางลิงก์ Google Maps หรือพิกัด" style="flex:1;min-width:0" autocomplete="off">
      <button class="small-btn" id="${p}Find">${busyTxt === 'find' ? 'กำลังหา…' : 'ค้นหา'}</button></div>
    <div class="help">เปิดแอป Google Maps → แตะร้าน → <b>แชร์</b> → <b>คัดลอกลิงก์</b> แล้ววางในช่องนี้ · ไม่ต้องอยู่ที่ร้าน</div>
    <button class="small-btn ghost" id="${p}Here" style="align-self:flex-start">${busyTxt === 'here' ? 'กำลังหาตำแหน่ง…' : 'หรือ ใช้ตำแหน่งตอนนี้ (ยืนอยู่ในร้าน)'}</button></div>`;
}
function wireLoc(p, onPick, setBusy) {
  const $ = id => document.getElementById(id);
  const f = $(p + 'Find'), h = $(p + 'Here');
  if (f) f.onclick = async () => {
    const text = $(p + 'Link').value.trim();
    if (!text) return toast('วางลิงก์ Google Maps หรือพิมพ์พิกัดก่อนนะ', 'bad');
    setBusy('find');
    let r = null;
    try { r = await api('mapLink', { text }); } catch (e) { r = { ok: false, text: '📶 ' + nong('offline') }; }
    setBusy('');
    if (r && r.ok) onPick(r.lat, r.lng); else toast((r && (r.text || r.error)) || 'อ่านลิงก์ไม่ได้', 'bad', 9000);
  };
  if (h) h.onclick = async () => {
    setBusy('here');
    let pos = null;
    try { pos = await getBestPosition(); } catch (e) { toast('❌ ' + e.message, 'bad', 9000); }
    setBusy('');
    if (pos) onPick(pos.coords.latitude, pos.coords.longitude);
  };
}

// ---------- แจ้งในกลุ่ม (liff.sendMessages — ส่งในนามพนักงาน ไม่ใช่ push ของบอท) ----------
let pendingShare = '', shareErr = '';   // shareErr = รหัสจาก LINE ครั้งล่าสุดที่ส่งไม่ผ่าน (FORBIDDEN = ยังไม่ติ๊ก chat_message.write)
try { pendingShare = localStorage.getItem('pendingShare') || ''; } catch (e) {}
function setPendingShare(t) { pendingShare = t || ''; try { localStorage.setItem('pendingShare', pendingShare); } catch (e) {} }
function inGroup() {
  try { const c = liff.getContext(); return !!c && (c.type === 'group' || c.type === 'room'); } catch (e) { return false; }
}
/** บันทึกลงชีตเสร็จก่อนเสมอ แล้วค่อยส่ง · ส่งพลาด → เก็บไว้ให้กด "ส่งแจ้งอีกครั้ง" (เวลาที่บันทึกไม่หาย) */
async function shareToGroup(text, card, picked) {
  if (!text) return;
  if (!inGroup()) {   // เปิดจากริชเมนู/แชทบอท/เบราว์เซอร์ → ส่งตรงเข้ากลุ่มไม่ได้: เปิดหน้าเลือกกลุ่มให้ทันที (แตะกลุ่มร้านครั้งเดียว)
    setPendingShare(text);                       // เลือกไม่สำเร็จ/ปิดหน้าเลือก = การ์ดค้างแจ้งยังอยู่
    if (liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker')) {
      try {
        const r = await liff.shareTargetPicker([card || { type: 'text', text: text.slice(0, 4900) }]);
        if (r) { setPendingShare(''); toast('📣 ส่งแจ้งในกลุ่มแล้ว', 'ok'); }
      } catch (e) { toast('📣 เลือกกลุ่มส่งไม่สำเร็จ (' + lineErr(e) + ')', 'warn', 8000); }
    } else if (picked) toast('📣 ส่งจากหน้านี้ไม่ได้ — เปิดลิงก์ร้านจากในห้องแชทกลุ่มร้าน แล้วกดใหม่', 'warn', 8000);
    return render();
  }
  try {
    if (!liff.isApiAvailable('sendMessages')) throw new Error('ส่งข้อความจากหน้านี้ไม่ได้');
    let sent = false;
    if (card) {   // การ์ดน้องพร้อม (ร้านที่เปิดสวิตช์) · ส่งไม่ผ่าน → ส่งข้อความธรรมดาแทน
      try { await liff.sendMessages([card]); sent = true; } catch (e) { console.warn('card', e); }
    }
    if (!sent) await liff.sendMessages([{ type: 'text', text: text.slice(0, 4900) }]);
    setPendingShare(''); shareErr = '';
  } catch (e) {
    setPendingShare(text);
    // บอกสาเหตุจริงจาก LINE ด้วย (เช่น ไม่ได้ติ๊ก chat_message.write) จะได้แก้ถูกจุด
    const why = lineErr(e);
    shareErr = why;
    toast('📣 บันทึกเวลาแล้ว แต่ส่งแจ้งในกลุ่มไม่สำเร็จ\nกด "ส่งแจ้งอีกครั้ง" ได้เลย' + (why ? '\n(' + why + ')' : ''), 'warn', 10000);
  }
  render();
}

/** 🧪 ทดสอบส่งเข้ากลุ่ม: ไม่ใช้ GPS ไม่บันทึกเวลา ไม่แตะการ์ดค้างแจ้ง · ส่งทางเดียวกับตอนกดเข้างานจริง */
async function testShare() {
  if (busy.test) return;
  const text = `🧪 ทดสอบส่งเข้ากลุ่ม · ${S.me.name} · ${S.shop || ''} ${hhmm(nowMs())} น. (ไม่ได้ลงเวลา)`;
  const why = lineErr;
  busy.test = true; render();
  try {
    if (!inGroup()) {
      toast('⚠️ เปิดแอปจากแชทส่วนตัว/นอกไลน์ · กดเข้างานจะไม่ส่งเข้ากลุ่มเอง\nให้เปิดจากปุ่ม "ลงเวลา" ในกลุ่มร้าน', 'warn', 10000);
      if (liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker')) {
        try { if (await liff.shareTargetPicker([{ type: 'text', text }])) toast('✅ ส่งผ่านหน้าเลือกกลุ่มได้ · แต่ให้เปิดแอปจากในกลุ่มจะส่งเองทุกครั้ง', 'ok', 8000); }
        catch (e) { toast('❌ เลือกกลุ่มส่งไม่สำเร็จ (' + why(e) + ')', 'bad', 10000); }
      }
    } else {
      try {
        if (!liff.isApiAvailable('sendMessages')) throw new Error('ส่งข้อความจากหน้านี้ไม่ได้');
        await liff.sendMessages([{ type: 'text', text }]);
        toast('✅ ส่งเข้ากลุ่มได้ · กดเข้างานจริงก็จะเข้ากลุ่มแบบนี้', 'ok', 6000);
      } catch (e) {
        const w = why(e);
        toast('❌ ส่งเข้ากลุ่มไม่ได้' + (w ? ' (' + w + ')' : '') + (/FORBIDDEN|permission/i.test(w) ? '\n→ ติ๊ก chat_message.write ในหน้า LIFF' : ''), 'bad', 10000);
      }
    }
  } finally { busy.test = false; render(); }
}

  renderBill();
  if (!S) return;
  document.getElementById('title').textContent = (S.shop || '') + ' · โคตรพร้อม';
  if (!S.registered) { document.getElementById('who').textContent = 'ยินดีต้อนรับ'; return renderRegister(); }
  if (joinMode && S.canJoin) return renderRegister();      // ผู้สร้าง/แอดมินลงชื่อเป็นพนักงานของร้านนี้
  joinMode = false;
  document.getElementById('who').textContent = 'สวัสดี ' + S.me.name;
  const dt = document.getElementById('date');
  dt.hidden = false;
  dt.textContent = S.day.label;
  // ไม่นับเป็นพนักงาน (ผู้สร้าง/แอดมิน/เจ้าของ/ผู้จัดการที่ไม่ต้องลงเวลา) = ไม่มีหน้าลงเวลา/ขอลา/ของฉัน
  const tabs = S.me.noClock ? [['audit', TAB_ICON.audit, 'ประวัติ']]
    : [['time', TAB_ICON.time, 'ลงเวลา'], ['leave', TAB_ICON.leave, 'ขอลา'], ['my', TAB_ICON.my, 'ของฉัน'], ['audit', TAB_ICON.audit, 'ประวัติ']];
  if (S.me.boss) tabs.push(['boss', TAB_ICON.boss, 'ผู้จัดการ']);
  if (S.me.noClock && !tabs.some(t => t[0] === tab)) { tab = S.me.boss ? 'boss' : 'audit'; setTimeout(() => { if (tab === 'boss') loadBoss(); else loadAudit(); }, 0); }
  const nav = document.getElementById('tabs');
  nav.hidden = false;
  nav.innerHTML = tabs.map(t => `<button class="${tab === t[0] ? 'on' : ''}" data-tab="${t[0]}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${t[1]}"/></svg>${t[2]}</button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => {
    tab = b.dataset.tab; armed = ''; render();
    if (tab === 'my') loadMy(); if (tab === 'boss') loadBoss(); if (tab === 'audit') loadAudit();
  });
  if (tab === 'time') renderTime();
  else if (tab === 'leave') renderLeave();
  else if (tab === 'my') renderMy();
  else if (tab === 'audit') renderAudit();
  else if (tab === 'boss') renderBoss();
}

// ---------- ลงทะเบียน: เลือกชื่อที่ผู้จัดการ/แอดมินเพิ่มไว้ + รหัส 4 ตัว (ไม่ต้องสมัคร) ----------
let regMode = '', regPick = '', joinMode = false, regCode = '', regRe = false;   // regCode: วาดหน้าใหม่แล้วรหัสไม่หาย · regRe: ขอไปแล้วแต่จะเลือกชื่อใหม่
document.addEventListener('touchstart', () => {}, { passive: true });   // iOS แสดงอาการกดปุ่ม (:active) เฉพาะหน้าที่ฟัง touchstart
function renderRegister() {
  document.getElementById('tabs').hidden = true;
  document.getElementById('date').hidden = true;
  const app = document.getElementById('app');
  const free = S.free || [], all = S.names || [];
  const codeBox = `<div class="field" style="margin:14px 0 0"><label for="rgCode">รหัสร้าน 4 ตัว (ขอจากผู้จัดการ)</label>
      <input id="rgCode" inputmode="numeric" autocomplete="off" maxlength="8" value="${esc(regCode)}"></div>`;
  const sending = busy.claimReq || busy.relink || busy.register;
  if (regMode === 'new') {
    app.innerHTML = `
      <div class="card hero"><div class="hm">${nongSvg('happy', 110)}</div><h2 style="margin:6px 0 0">ลงทะเบียนชื่อใหม่</h2>
        <div class="muted">ใช้เมื่อไม่มีชื่อของคุณในรายชื่อ</div></div>
      <div class="card"><div class="field" style="margin:0"><label for="rgName">ชื่อเล่น (คำเดียว)</label><input id="rgName" autocomplete="off"></div>${codeBox}</div>
      <button class="btn" id="rgGo">ลงทะเบียน</button>
      <div class="gap"></div><button class="btn quiet" id="rgBack">ย้อนกลับ</button>`;
    document.getElementById('rgBack').onclick = () => { regMode = ''; render(); };
    document.getElementById('rgGo').onclick = () => {
      const name = document.getElementById('rgName').value.trim(), code = document.getElementById('rgCode').value.trim();
      if (!name) return toast('ใส่ชื่อเล่นก่อนนะ', 'bad');
      if (!code) return toast('ใส่รหัสร้านด้วย', 'bad');
      act('register', { name, code });
    };
    return;
  }
  const owners = S.owners || [];
  const btns = all.map(n => {
    const isFree = free.indexOf(n) >= 0, own = owners.indexOf(n) >= 0;
    return `<button data-n="${esc(n)}" class="${regPick === n ? 'on' : ''}${isFree ? '' : ' taken'}">${esc(n)}${isFree ? '' : `<small>ผูกเครื่องอื่นแล้ว · ${own ? 'แตะเพื่อขอย้าย' : 'ใส่รหัสย้ายมาเครื่องนี้ได้'}</small>`}</button>`;
  }).join('');
  // ชื่อที่ผูกเครื่องอื่นอยู่: รหัสร้านถูก = ย้ายมาได้เลย · เฉพาะชื่อเจ้าของร้านต้องขอย้ายเครื่อง (แอดมินอนุมัติ)
  const taken = regPick && free.indexOf(regPick) < 0 && owners.indexOf(regPick) >= 0;
  const moving = regPick && free.indexOf(regPick) < 0 && !taken;
  const uidLine = S.uid ? `<div class="muted center" style="font-size:13px;margin-top:14px;word-break:break-all">ไอดีของคุณ: ${esc(S.uid)} <button class="small-btn ghost" id="rgUid" style="padding:2px 10px;min-height:0">ก๊อป</button></div>` : '';
  if (S.claim && !regRe) {   // ส่งคำขอแล้ว → หน้านี้มีแค่สถานะรอ (ไม่ให้แตะซ้ำแล้วงงว่าส่งหรือยัง)
    app.innerHTML = `<div class="card hero"><div class="hm">${nongSvg('happy', 110)}</div>
        <h2 style="margin:6px 0 0">ส่งคำขอแล้ว ⏳</h2>
        <div style="font-weight:600">ขอย้ายเครื่องเป็น <b>${esc(S.claim.name)}</b><br>รอผู้จัดการกดอนุมัติในแอป แล้วแตะ "เช็คอีกครั้ง"</div></div>
      <button class="btn" id="rgCheck">เช็คอีกครั้ง</button>
      <div class="center"><button class="small-btn ghost" id="rgRe" style="margin-top:8px">เลือกชื่อใหม่</button></div>${uidLine}`;
    document.getElementById('rgCheck').onclick = async e => { e.target.disabled = true; e.target.textContent = 'กำลังเช็ค… ⏳'; await refresh(); render(); if (S && S.claim && !S.registered) toast('ยังรอผู้จัดการอนุมัติอยู่', 'warn'); };
    document.getElementById('rgRe').onclick = () => { regRe = true; render(); };
    const ru0 = document.getElementById('rgUid');
    if (ru0) ru0.onclick = () => copyText(S.uid);
    return;
  }
  app.innerHTML = `
    <div class="card hero" style="background:var(--brand-500);border-color:var(--brand-500)"><div class="hm">${nongSvg('wink', 120)}</div>
      <h2 style="margin:4px 0 0;font-size:26px">สวัสดี! คุณคือใคร?</h2><div style="font-weight:600">แตะชื่อตัวเอง ทำครั้งเดียว ใช้ได้ตลอด</div></div>
    <div class="card">${btns ? `<div class="pick">${btns}</div>` : '<div class="muted">ร้านนี้ยังไม่มีรายชื่อ — ให้ผู้จัดการเพิ่มชื่อก่อน หรือแตะ "ไม่เจอชื่อ" ด้านล่าง</div>'}
      ${regPick ? codeBox : ''}
      ${taken ? `<div class="note warn">ชื่อ ${esc(regPick)} เป็นเจ้าของร้าน · ส่งคำขอย้ายมาเครื่องนี้ แล้วให้แอดมินกดอนุมัติ</div>` : ''}
      ${moving ? `<div class="note warn">ชื่อ ${esc(regPick)} ผูกกับเครื่องอื่นอยู่ · ใส่รหัสร้านแล้วจะย้ายมาเครื่องนี้ (เครื่องเดิมใช้ไม่ได้)</div>` : ''}</div>
    <button class="btn" id="rgGo" ${regPick && !sending ? '' : 'disabled'}>${sending ? 'กำลังส่ง… ⏳' : !regPick ? 'แตะชื่อของคุณก่อน' : taken ? 'ขอย้ายเครื่องมาที่นี่' : 'ใช่ ฉันคือ ' + esc(regPick)}</button>
    <div class="center"><button class="small-btn ghost" id="rgNew" style="margin-top:8px">ไม่เจอชื่อ? ลงทะเบียนใหม่</button></div>
    ${joinMode ? '<div class="gap"></div><button class="btn quiet" id="rgCancel">กลับหน้าผู้จัดการ</button>' : ''}
    ${uidLine}${appFoot()}`;
  const rcode = document.getElementById('rgCode');
  if (rcode) rcode.oninput = () => { regCode = rcode.value; };
  const ru = document.getElementById('rgUid');
  if (ru) ru.onclick = () => copyText(S.uid);
  const rc = document.getElementById('rgCancel');
  if (rc) rc.onclick = () => { joinMode = false; regPick = ''; render(); };
  app.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { regPick = b.dataset.n; render(); const c = document.getElementById('rgCode'); if (c) c.focus(); });
  document.getElementById('rgNew').onclick = () => { regMode = 'new'; render(); };
  document.getElementById('rgGo').onclick = () => {
    const c = document.getElementById('rgCode'), code = c ? c.value.trim() : '';
    if (!regPick) return;
    if (!code) return toast('ใส่รหัสร้าน 4 ตัวด้วยนะ', 'bad');
    const a = taken ? 'claimReq' : 'relink';
    const p = act(a, { name: regPick, code });
    render();                                     // ปุ่มขึ้น "กำลังส่ง…" ทันที
    p.then(res => { if (res && res.ok && a === 'claimReq') { regRe = false; window.scrollTo(0, 0); } });
  };
}

/** ยังไม่รู้ว่าเป็นร้านไหน (ไม่ได้เปิดจากลิงก์ร้าน) */
function renderNoShop() {
  adminButton();
  document.getElementById('tabs').hidden = true;
  document.getElementById('date').hidden = true;
  document.getElementById('bill').hidden = true;
  if (NO_SHOP && NO_SHOP.locked) {   // เลยกำหนดชำระ + ช่วงผ่อน → พักระบบ (ข้อมูลยังอยู่)
    document.getElementById('title').textContent = (NO_SHOP.shop || '') + ' · โคตรพร้อม';
    document.getElementById('who').textContent = 'ระบบพักชั่วคราว';
    document.getElementById('app').innerHTML = `<div class="card hero"><div class="hm">${nongSvg('sad', 120)}</div>
      <h2 style="margin:4px 0 0">ระบบพักชั่วคราวน้า~</h2><pre style="margin-top:8px">${esc(NO_SHOP.error)}</pre></div>
      <button class="btn quiet" id="lkRe">ลองใหม่<small>จ่ายแล้วแตะตรงนี้</small></button>
      ${IS_ADMIN ? '<div class="gap"></div><button class="btn quiet" id="goAdmin">เข้าโหมดแอดมิน</button>' : ''}`;
    document.getElementById('lkRe').onclick = () => { document.getElementById('app').innerHTML = loadingHtml(); refresh(true); };
    const ga0 = document.getElementById('goAdmin');
    if (ga0) ga0.onclick = () => { tab = 'admin'; adm = { view: 'home' }; renderAdmin(); loadAdmin(); };
    return;
  }
  document.getElementById('title').textContent = 'โคตรพร้อม เข้างาน';
  document.getElementById('who').textContent = 'ยินดีต้อนรับ';
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card hero"><div class="hm">${nongSvg('search', 120)}</div>
      <h2 style="margin:4px 0 0">น้องพร้อมหาร้านไม่เจอน้า~</h2>
      <div class="muted">${esc((NO_SHOP && NO_SHOP.error) || '')}</div></div>
    <div class="card"><div class="field" style="margin:0"><label for="shopIn">หรือใส่รหัสร้าน 6 ตัว</label>
      <input id="shopIn" autocomplete="off" maxlength="12" style="text-transform:uppercase" placeholder="เช่น NNH731"></div></div>
    <button class="btn" id="shopGo">เปิดร้านนี้</button>
    ${IS_ADMIN ? '<div class="gap"></div><button class="btn quiet" id="goAdmin">เข้าโหมดแอดมิน<small>สร้างร้าน · จัดการร้านทั้งหมด</small></button>' : ''}`;
  document.getElementById('shopGo').onclick = () => {
    const v = document.getElementById('shopIn').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!v) return toast('ใส่รหัสร้านก่อนนะ', 'bad');
    rememberShop(v); app.innerHTML = loadingHtml(); refresh(true);
  };
  const ga = document.getElementById('goAdmin');
  if (ga) ga.onclick = () => { tab = 'admin'; adm = { view: 'home' }; renderAdmin(); loadAdmin(); };
}

/** การ์ดบนสุด: นาฬิกาใหญ่ + สถานะสั้นๆ บรรทัดเดียว */
function hero(top, statusText, statusCls, extra, mood) {
  const m = mood || ({ ok: 'wink', warn: 'sweat', bad: 'sad' })[statusCls] || 'happy';
  return `<div class="card hero"><div class="hm">${nongSvg(m, 96)}</div><div><span class="status ${statusCls || ''}">${statusText}</span></div>${top}${extra || ''}</div>`;
}

function renderTime() {
  if (!S || !S.registered || tab !== 'time') return;
  const app = document.getElementById('app');
  const t = nowMs(), d = S.today, ot = S.ot;
  const clock = `<div class="clock">${hhmm(t)}</div>`;
  const checkedIn = d && d.status === ST_WORK && d.in;
  const out = checkedIn && (d.out || d.early);
  const offStatus = d && d.status && d.status !== ST_WORK;
  const showOt = S.perPerson && S.me.ot;
  const v = otView(t);
  const lateLine = checkedIn && (d.late || d.fine) ? `<div class="note warn">สาย ${d.late} นาที${S.noMoney ? '' : ` · หัก ${baht(d.fine)} บาท`}</div>` : '';
  let html = '';

  if (pendingShare) {
    html += `<div class="card"><div class="note warn" style="margin-top:0">📣 ยังไม่ได้แจ้งในกลุ่ม<br><span style="font-size:15px">${esc(pendingShare.split('\n')[0])}</span></div>
      ${inGroup() ? '' : '<div class="muted" style="font-size:14px;margin-top:6px">ไม่ได้เปิดจากห้องแชทกลุ่ม · แตะส่งแล้วเลือกกลุ่มร้าน</div>'}
      ${shareErr ? `<div class="muted" style="font-size:14px;margin-top:6px">LINE ตอบว่า: ${esc(shareErr)}${/FORBIDDEN|permission/i.test(shareErr) ? ' → ติ๊ก chat_message.write ในหน้า LIFF' : ''}</div>` : ''}
      <div class="gap" style="height:10px"></div><div class="row"><button class="small-btn" id="bShare" style="flex:2">📣 ${inGroup() ? 'ส่งแจ้งอีกครั้ง' : 'เลือกกลุ่มแล้วส่ง'}</button>
      <button class="small-btn ghost" id="bShareX" style="flex:1">ไม่ต้อง</button></div></div>`;
  }

  // 1) สถานะ
  if (busy.checkin) html += hero(clock, 'กำลังหาตำแหน่ง…', 'warn', '<div class="muted" style="margin-top:8px">ถือมือถือนิ่งๆ สักครู่น้า~</div>', 'search');
  else if (S.day.closedDay) html += hero('<div class="result">พักให้เต็มที่นะ</div>', S.day.holiday ? '🏮 วันนี้ร้านหยุด · ' + esc(S.day.holiday) : 'วันนี้ร้านหยุด', '', '', 'sleepy');
  else if (offStatus) html += hero(clock, 'บันทึกว่า ' + esc(d.status), 'bad', '<div class="muted" style="margin-top:8px">ถ้าผิด แจ้งผู้จัดการ</div>');
  else if (!checkedIn) html += hero(clock, S.day.works ? 'ยังไม่เข้างาน' : S.shift ? 'วันนี้หยุดตามตารางกะ' : 'วันนี้ไม่ใช่วันทำงานของคุณ', '', '', S.day.works ? undefined : 'sleepy');
  else if (!out) html += hero(clock, 'ทำงานอยู่ · เข้า ' + esc(d.in), d.late ? 'warn' : 'ok', lateLine);
  else if (d.early) html += hero(clock, 'กลับก่อน ' + esc(d.early), '', '<div class="result">ไม่มี OT คืนนี้<small>ไม่หักค่าแรง</small></div>' + lateLine);
  else html += hero(clock, (busy.checkout ? 'กำลังบันทึก… ' : 'เลิกงานแล้ว ') + esc(d.out), '',
    '<div class="muted" style="margin-top:6px">เหนื่อยหน่อยนะวันนี้ พักผ่อนเยอะๆ</div>' + (showOt && !busy.checkout ? `<div class="result">${d.rounds ? (S.noMoney ? `OT ${d.rounds} รอบ<small>คืนนี้</small>` : `OT ${baht(d.rounds * ot.rate)} บาท<small>${d.rounds} รอบ</small>`) : 'ไม่มี OT<small>ยังไม่ถึงรอบ</small>'}</div>` : '') + lateLine, 'sleepy');

  if (S.branch) html += `<div class="center" style="margin:-4px 0 10px"><span class="pill blue" style="font-size:16px;padding:4px 12px">🏬 ${esc(S.branch)}</span></div>`;
  const sf = S.shift && S.shift.today;
  if (sf && !sf.off) html += `<div class="center" style="margin:-4px 0 10px"><span class="sft ${sftCls(sf.name, S.shift.list)}" style="padding:4px 14px;font-size:17px">วันนี้ กะ${esc(sf.name)} ${esc(sf.in)}–${esc(sf.out)}</span></div>`;

  // 2) ปุ่มหลัก (ทีละปุ่ม)
  if (!S.day.closedDay && !offStatus) {
    if (!checkedIn && !busy.checkin) {
      html += `<button class="btn green" id="bIn">เข้างาน<small>${S.photo ? '📸 ถ่ายรูปก่อน แล้วบันทึกเลย' : 'กดตอนอยู่ที่ร้าน'}</small></button>`;
    } else if (checkedIn && !out) {
      if (showOt && v.beforeStd) {
        // ก่อนเวลาปิดมาตรฐาน = กลับก่อน (ไม่ได้ OT ทั้งคืน)
        const lbl = armed === 'early' ? 'แตะอีกครั้ง ยืนยัน' : 'กลับก่อน';
        html += `<button class="btn orange${armed === 'early' ? ' confirm' : ''}" id="bEarly">${lbl}<small>ก่อน ${ot.stdHm} · ${S.shift ? 'กะนี้' : 'คืนนี้'}ไม่ได้ OT</small></button>`;
        html += `<span class="hint">⏳ อยู่ถึง ${hhmm(ot.std + ot.first * 60000)} ได้ OT${S.noMoney ? ' รอบแรก' : ` ${baht(ot.rate)} บ.`}</span>`;
      } else {
        let sub = 'บันทึกเวลาออก';
        if (showOt) sub = v.rounds === 0 ? 'ยังไม่ถึงรอบ OT' : `ได้ OT ${v.rounds} รอบ${S.noMoney ? '' : ` · ${baht(v.money)} บาท`}`;
        const lbl = armed === 'out' ? 'แตะอีกครั้ง ยืนยัน' : 'เลิกงาน';
        html += `<button class="btn${armed === 'out' ? ' confirm' : ''}" id="bOut">${lbl}<small>${esc(sub)}</small></button>`;
        if (showOt && !S.closed) {
          html += `<span class="hint">⏳ รออีก ${v.waitMin} นาที ${v.rounds === 0 ? 'ได้ OT' : 'ได้เพิ่ม'}${S.noMoney ? ' 1 รอบ' : ` ${baht(ot.rate)} บ.`}</span>`;
        }
      }
    }
    if (!inGroup() && !checkedIn) html += '<div class="note warn" style="margin-top:10px">📣 ไม่ได้เปิดจากกลุ่มร้าน · กดเข้างานแล้วต้องเลือกกลุ่มส่งเอง<br><span style="font-size:15px">ให้ส่งเข้ากลุ่มอัตโนมัติ: พิมพ์ <b>ลงเวลา</b> ในกลุ่มร้าน แล้วเปิดแอปจากปุ่มนั้น</span></div>';
  }

  html += swapHtml(true);           // คำขอสลับกะที่รอตอบ ขึ้นใกล้ๆ ปุ่ม (ไม่ต้องเลื่อนหา)

  // 3) ใครยังอยู่ที่ร้าน
  if (checkedIn || t >= ot.std) {
    html += '<div class="gap"></div>';
    if (S.closed) {
      html += `<div class="card"><div class="row"><span style="font-size:26px">🌙</span><div><b>ปิดร้านแล้ว ${esc(S.closed.hm)}</b><div class="muted">โดย ${esc(S.closed.by)}</div></div></div></div>`;
    } else {
      const chips = S.staying.map(n => `<span class="chip">${esc(n)}</span>`).join('') +
                    S.stayingOther.map(n => `<span class="chip grey">${esc(n)} · ครัว</span>`).join('');
      html += `<div class="card"><h2>ยังอยู่ที่ร้าน ${S.staying.length} คน</h2>
        ${chips ? `<div class="chips">${chips}</div>` : '<div class="muted">กลับหมดแล้ว</div>'}
        ${showOt && v.warn ? `<div class="note warn">⚠️ ตอนนี้อยู่ ${S.staying.length} คน · ร้านตั้งไว้ว่าหลังรอบแรกให้เหลือ ${ot.keep} คน<br>ตกลงกันเองว่าใครอยู่ต่อ</div>` : ''}</div>`;
    }
  }

  // 4) ปิดร้าน — คืนละครั้ง: ยังมีคนอยู่ = ปุ่มเล็ก · ไม่เหลือใครแล้ว = ปุ่มใหญ่ (ไม่ซ่อนใน ⋯ กันคนสุดท้ายหาไม่เจอ) · ร้านแบบกะไม่มีปิดร้าน
  if (t >= ot.std && !S.closed && !S.day.closedDay && !S.shift) {
    const lbl = busy.close ? '<span class="busy">กำลังปิดร้าน</span>' : armed === 'close' ? `แตะอีกครั้ง ปิดร้าน ${hhmm(t)}` : '🌙 ปิดร้าน';
    const alone = !S.staying.length && !S.stayingOther.length;
    html += alone || armed === 'close'
      ? `<button class="btn quiet${armed === 'close' ? ' confirm' : ''}" id="bClose" ${busy.close ? 'disabled' : ''}>${lbl}<small>คนสุดท้ายกด</small></button>`
      : `<div class="center"><button class="small-btn ghost" id="bClose" ${busy.close ? 'disabled' : ''}>${lbl} · คนสุดท้ายกด</button></div>`;
  }
  // 5) กะของฉันสัปดาห์นี้
  if (S.shift && S.shift.week) {
    const lst = S.shift.list || [];
    html += `<div class="gap"></div><div class="card"><h2>กะของฉันสัปดาห์นี้</h2><div class="wkstrip">${S.shift.week.map(x =>
      `<div style="${x.k === S.day.key ? 'color:var(--brand-ink)' : ''}">${DOW_ALL[x.dow]} ${+x.k.slice(8)}<span class="sft ${x.name === 'หยุด' ? 'off' : x.in ? sftCls(x.name, lst) : 'na'}">${esc(x.name ? (x.name.length > 4 ? x.name.slice(0, 3) : x.name) : '–')}</span></div>`).join('')}</div>
      ${S.shift.week.filter(x => x.in).length ? `<div class="muted" style="font-size:14px;margin-top:8px">${esc(S.shift.week.filter((x, i, a) => x.in && a.findIndex(y => y.name === x.name) === i).map(x => `${x.name} ${x.in}–${x.out}`).join(' · '))}</div>` : ''}</div>`;
  }
  html += swapHtml(false);
  html += `<div class="center" style="margin-top:16px"><button class="small-btn ghost" id="bTest" ${busy.test ? 'disabled' : ''}>${busy.test ? 'กำลังส่ง…' : '🧪 ทดสอบส่งเข้ากลุ่ม'}</button></div>`;
  app.innerHTML = html + appFoot();

  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('bTest', testShare);
  on('bIn', checkIn);
  on('bShare', () => shareToGroup(pendingShare, null, true));
  on('bShareX', () => { setPendingShare(''); render(); });
  // รอบ A: ส่งเวลาที่แตะ (tap) ไปด้วย — เซิร์ฟเวอร์ใช้เวลานี้ถ้าไม่เก่ากว่า 90 วิ (ไม่โดนนับช้าเพราะรอคิว/เน็ต)
  on('bOut', () => twoTap('out', () => {
    const tap = nowMs(), at = hhmm(tap);
    act('checkout', { at: tap }, s => { s.today.out = at; s.staying = s.staying.filter(n => n !== s.me.name); });
  }));
  on('bEarly', () => twoTap('early', () => {
    const tap = nowMs(), at = hhmm(tap);
    act('early', { at: tap }, s => { s.today.early = at; s.today.out = at; s.staying = s.staying.filter(n => n !== s.me.name); });
  }));
  on('bClose', () => twoTap('close', () => doClose()));
  wireSwap();
}

// ---------- 🔁 ขอสลับกะ: เลือกวัน + เพื่อน → เพื่อนกดยินยอมในแอป → สลับทันที + แจ้งกลุ่ม ----------
const swapF = { date: '', with: '' };
function swapHtml(cards) {
  if (!S.shift) return '';
  const sw = S.swaps || [], ppl = S.swapPeople || [];
  let h = sw.map(x => {
    const line = `${esc(x.label)} · ${esc(x.from)} ${esc(x.fromShift || '-')} ↔ ${esc(x.to)} ${esc(x.toShift || '-')}`;
    const btns = x.toMe
      ? `<div class="row" style="margin-top:12px"><button class="small-btn green" data-swy="${esc(x.id)}" style="flex:1">ยินยอม</button>
         <button class="small-btn red" data-swn="${esc(x.id)}" style="flex:1">${armed === 'swn' + x.id ? 'แตะอีกครั้ง' : 'ไม่ยินยอม'}</button></div>`
      : `<div class="row" style="margin-top:12px"><span class="muted" style="flex:1">รอ ${esc(x.to)} ตอบ</span>
         <button class="small-btn ghost" data-swc="${esc(x.id)}">${armed === 'swc' + x.id ? 'แตะอีกครั้ง' : 'ยกเลิก'}</button></div>`;
    return `<div class="card"${x.toMe ? ' style="border-color:var(--brand)"' : ''}><h2 style="margin:0">🔁 ${x.toMe ? esc(x.from) + ' ขอสลับกะกับคุณ' : 'คำขอสลับกะ'}</h2>
      <div class="muted">${line}</div>${btns}</div>`;
  }).join('');
  if (cards) return h ? '<div class="gap"></div>' + h : '';
  if (!ppl.length) return '';
  const days = [];
  const base = new Date(nowMs());
  for (let i = 0; i < 14; i++) {
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    if (k < S.day.key) continue;
    const c = (S.cal || []).find(x => x.k === k);
    days.push(`<option value="${k}"${swapF.date === k ? ' selected' : ''}>${DOW_ALL[d.getDay()]} ${dmy(k)}${c && c.shift ? ' · กะ' + esc(c.shift) : ''}</option>`);
  }
  const form = `<div class="card"><h2>🔁 ขอสลับกะกับเพื่อน</h2>
    <div class="muted" style="font-size:15px">เพื่อนกดยินยอมในแอป → สลับในตารางกะทันที · แจ้งกลุ่มให้ด้วย</div>
    <div class="field"><label for="swD">วันที่</label><select id="swD"><option value="">เลือกวัน</option>${days.join('')}</select></div>
    <div class="field"><label for="swW">สลับกับ</label><select id="swW"><option value="">เลือกเพื่อน</option>${ppl.map(n => `<option${swapF.with === n ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
    <button class="btn" id="swGo" style="margin:0;min-height:64px;font-size:22px"${busy.swapReq ? ' disabled' : ''}>${busy.swapReq ? 'กำลังส่ง…' : 'ส่งคำขอ'}</button></div>`;
  return `<div class="gap"></div><div class="more center">${moreBtn('swap', '🔁 ขอสลับกะ')}</div>${moreBox('swap', form)}`;
}
function wireSwap() {
  const d = document.getElementById('swD'), w = document.getElementById('swW'), g = document.getElementById('swGo');
  if (d) d.onchange = () => { swapF.date = d.value; };
  if (w) w.onchange = () => { swapF.with = w.value; };
  if (g) g.onclick = async () => {
    if (!swapF.date || !swapF.with) return toast('เลือกวันและเพื่อนก่อนนะ', 'bad');
    const r = await act('swapReq', { date: swapF.date, with: swapF.with });
    if (r && r.ok) { swapF.date = ''; swapF.with = ''; }
  };
  const ans = (id, extra) => act('swapAnswer', Object.assign({ id }, extra), s => { s.swaps = (s.swaps || []).filter(x => x.id !== id); });
  document.querySelectorAll('[data-swy]').forEach(b => b.onclick = () => ans(b.dataset.swy, { yes: true }));
  document.querySelectorAll('[data-swn]').forEach(b => b.onclick = () => twoTap('swn' + b.dataset.swn, () => ans(b.dataset.swn, { yes: false })));
  document.querySelectorAll('[data-swc]').forEach(b => b.onclick = () => twoTap('swc' + b.dataset.swc, () => ans(b.dataset.swc, { cancel: true })));
}

async function doClose(time) {
  const at = time || hhmm(nowMs());
  return act('close', time ? { time } : {}, s => { s.closed = { hm: at, by: s.me.name }; });
}

// ---------- เช็คอิน GPS ----------
async function checkIn() {
  if (busy.checkin) return;
  const tap = nowMs();                       // รอบ A: เวลาที่แตะ ก่อนรอ GPS (สูงสุด ~10 วิ)
  let photo = '';
  if (S.photo) {                             // ร้านที่เปิด "ถ่ายรูปตอนเข้างาน" → ถ่ายก่อน แล้วค่อยหาตำแหน่ง
    try { photo = await takePhoto(`${S.me.name} · ${hhmm(tap)} น. · ${dmy(S.day.key)}`); }
    catch (e) { return toast('📸 ' + e.message, 'bad', 7000); }
    if (!photo) return;
  }
  busy.checkin = true; render();
  let pos;
  try { pos = await getBestPosition(); }
  catch (e) { busy.checkin = false; render(); return toast('❌ ' + e.message, 'bad', 9000); }
  busy.checkin = false;
  const c = pos.coords;
  act('checkin', { lat: c.latitude, lng: c.longitude, acc: Math.round(c.accuracy), at: tap, photo: photo || undefined },
      s => { s.today = { status: ST_WORK, in: hhmm(tap), out: '', early: '', rounds: 0 }; });
}

/** 📸 เปิดกล้องหน้า → ย่อเหลือด้านยาว 640px + แถบชื่อ/เวลา → JPEG ไม่เกิน ~80KB ('' = ปิดกล้องไปเฉยๆ) */
function takePhoto(label) {
  return new Promise((resolve, reject) => {
    let inp = document.getElementById('camIn');
    if (!inp) {
      inp = document.createElement('input');
      Object.assign(inp, { id: 'camIn', type: 'file', accept: 'image/*' });
      inp.setAttribute('capture', 'user'); inp.style.display = 'none';
      document.body.appendChild(inp);
    }
    inp.value = '';
    inp.oncancel = () => resolve('');
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return resolve('');
      const img = new Image();
      img.onerror = () => reject(new Error('เปิดรูปไม่ได้ ลองถ่ายใหม่'));
      img.onload = () => {
        const k = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const g = c.getContext('2d'), bar = Math.max(30, Math.round(c.height * 0.06));
        g.drawImage(img, 0, 0, c.width, c.height);
        g.fillStyle = 'rgba(33,20,13,.7)'; g.fillRect(0, c.height - bar, c.width, bar);
        g.fillStyle = '#fff'; g.font = `bold ${Math.round(bar * 0.55)}px sans-serif`; g.fillText(label, 10, c.height - bar * 0.3);
        URL.revokeObjectURL(img.src);
        let q = 0.72, u = c.toDataURL('image/jpeg', q);
        while (u.length > 110000 && q > 0.3) { q -= 0.1; u = c.toDataURL('image/jpeg', q); }
        resolve(u);
      };
      img.src = URL.createObjectURL(f);
    };
    inp.click();
  });
}

/** เก็บตำแหน่งหลายครั้งภายใน ~10 วินาที เลือกค่าที่แม่นที่สุด (GPS ครั้งแรกมักคลาดเยอะ) */
function getBestPosition(maxMs, goodAcc) {
  maxMs = maxMs || 10000; goodAcc = goodAcc || 25;
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('เครื่องนี้ใช้ GPS ไม่ได้ — ใช้วิธีแชร์ตำแหน่งในแชทแทน'));
    let best = null, done = false, id = null;
    const finish = err => {
      if (done) return; done = true;
      if (id !== null) navigator.geolocation.clearWatch(id);
      clearTimeout(timer);
      if (best) resolve(best);
      else reject(err || new Error('หาตำแหน่งไม่เจอ ลองออกไปที่โล่งแล้วกดใหม่'));
    };
    const timer = setTimeout(() => finish(), maxMs);
    id = navigator.geolocation.watchPosition(p => {
      if (!best || p.coords.accuracy < best.coords.accuracy) best = p;
      if (p.coords.accuracy <= goodAcc) finish();
    }, err => {
      if (err.code === 1) finish(new Error('ยังไม่อนุญาตให้ LINE ใช้ตำแหน่ง — เปิดสิทธิ์ตำแหน่งในการตั้งค่ามือถือ แล้วกดใหม่'));
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: maxMs });
  });
}

// ---------- ขอลา / ขอเข้าสาย — ปฏิทินเดียว 3 โหมด (สเปค 4.4) ----------
let leaveSel = [];
function calCell(c) {
  // สถานะใบลาเดิมของวันนั้น (ทุกประเภท)
  const st = (c.my || []).filter(x => x.status !== 'ปฏิเสธ');
  const rej = (c.my || []).some(x => x.status === 'ปฏิเสธ');
  const hasLeave = st.some(x => x.type !== 'ขอเข้าสาย'), hasPass = st.some(x => x.type === 'ขอเข้าสาย');
  let cls = '', tag = '';
  if (st.some(x => x.status === 'อนุมัติ')) cls = 'appr'; else if (st.length) cls = 'pend'; else if (rej) cls = 'rej';
  const isPass = leaveType === 'ขอเข้าสาย';
  const units = leaveType === 'พักร้อน' ? 0 : leaveType === 'ลาป่วย' ? c.sick : c.kij;
  // ลา: ย้อนหลังได้ (ฉุกเฉิน) แต่ไม่ใช่วันที่เข้างานแล้ว
  // ขอเข้าสาย: ย้อนหลังได้ไม่เกิน "ลาย้อนหลังได้" วัน เฉพาะวันที่มาทำงาน (ระบบคิดสายใหม่ให้) · วันนี้ได้ทั้งก่อนและหลังเข้างาน
  const back = (S.leaveCfg || {}).back || 0;
  const shut = c.off || (isPass ? (hasPass || c.ahead < -back || (c.ahead < 0 && !c.came))
                                : (hasLeave || (c.ahead <= 0 && (c.came || c.absent))));
  if (!c.off && !st.length) tag = isPass ? '' : (units ? `−${units}` : '0');
  if (st.length) tag = st[0].type === 'ขอเข้าสาย' ? 'สาย' : st[0].type.replace('ลา', '');
  if (leaveSel.indexOf(c.k) >= 0) cls = 'on';
  return `<button data-k="${c.k}" class="${cls}" ${shut ? 'disabled' : ''}>${+c.k.slice(8)}${tag ? `<i>${esc(tag)}</i>` : ''}</button>`;
}

function renderLeave() {
  const app = document.getElementById('app');
  const cal = S.cal || [], lc = S.leaveCfg || {}, wage = S.me.wage || 0;
  let grid = '', lastMon = -1;
  cal.forEach(function (c) {
    const mo = +c.k.slice(5, 7) - 1;
    if (mo !== lastMon) {
      lastMon = mo;
      grid += `<div class="mon">${MON_FULL[mo]} ${+c.k.slice(0, 4) + 543}</div>` + DOW.map(x => `<div class="dow">${x}</div>`).join('');
      for (let k = 0; k < c.dow; k++) grid += '<span></span>';
    }
    grid += calCell(c);
  });
  const isPass = leaveType === 'ขอเข้าสาย';
  const picked = cal.filter(c => leaveSel.indexOf(c.k) >= 0);
  let sum = '';
  if (picked.length) {
    let units = 0;
    const lines = picked.map(c => {
      const u = leaveType === 'พักร้อน' ? 0 : leaveType === 'ลาป่วย' ? c.sick : c.kij;
      units += u;
      const d = `${DOW[c.dow]}. ${+c.k.slice(8)}/${+c.k.slice(5, 7)}`;
      if (isPass) return `<div class="item"><div class="main">${d}${c.ahead < 0 ? ' <span class="pill warn">ย้อนหลัง</span>' : ''}</div><div class="amt">${S.noMoney ? 'ขอเข้าสาย' : `${baht(lc.fee)} บ.`}</div></div>`;
      return `<div class="item"><div class="main">${d}${c.ahead < 0 ? ' <span class="pill warn">ย้อนหลัง</span>' : c.adv ? '' : ' <span class="pill warn">กะทันหัน</span>'}</div>
        <div class="amt">${leaveType === 'พักร้อน' ? 'ไม่ได้ค่าแรง' : u ? `หัก ${u} แรง` : 'ไม่หัก'}</div></div>`;
    }).join('');
    const total = isPass ? (S.noMoney ? `ขอเข้าสาย ${picked.length} วัน` : `รวมค่าธรรมเนียม ${baht(lc.fee * picked.length)} บาท`)
                         : leaveType === 'พักร้อน' ? `พักร้อน ${picked.length} วัน · ไม่ได้ค่าแรง ค่าอาหาร · ไม่หักแรง`
                         : units ? `รวมหัก ${units} แรง${S.noMoney ? '' : ` ≈ ${baht(units * wage)} บาท`}` : 'ไม่หักแรง';
    sum = `<div class="card"><h2>เลือก ${picked.length} วัน</h2><div class="list">${lines}</div>
      <div class="total"><span>${total}</span></div>
      ${isPass ? `<div class="muted" style="margin-top:6px">เข้าได้ถึง ${esc(lc.until)} น. · ไม่โดนปรับนาที</div>` : ''}</div>`;
  }
  const lvPill = l => l.status === 'ปฏิเสธ' ? ['bad', 'ไม่อนุมัติ'] : l.status === 'รออนุมัติ' ? ['warn', 'รออนุมัติ'] :
                     l.checked ? ['blue', 'ผู้จัดการยืนยัน'] : ['blue', 'ระบบนับแล้ว'];
  const mine = (S.myLeaves || []).map(l => {
    const can = l.status !== 'ปฏิเสธ' && !l.checked, mid = 'lv' + l.id;
    return `<div class="item" style="flex-wrap:wrap"><div class="main"><div class="name">${esc(l.type)}</div>
      <div class="sub">${+l.date.slice(8)} ${MON[+l.date.slice(5, 7) - 1]}${l.units ? ` · หัก ${l.units} แรง` : ''}</div></div>
      <span class="pill ${lvPill(l)[0]}">${lvPill(l)[1]}</span>${can ? moreBtn(mid) : ''}
      ${can ? `<div style="width:100%">${moreBox(mid, `<button class="small-btn red" data-cancel="${esc(l.id)}" style="width:100%;min-height:56px">${armed === 'cancel' + l.id ? 'แตะอีกครั้ง ยืนยันยกเลิกใบลา' : 'ยกเลิกใบลานี้'}</button>`)}</div>` : ''}</div>`;
  }).join('');
  const backTxt = lc.back ? ` · ฉุกเฉินลาย้อนหลังได้ ${lc.back} วัน` : '';
  const hint = isPass ? `${S.noMoney ? '' : `ค่าธรรมเนียม ${baht(lc.fee)} บาท/วัน · `}ลืมขอ? ขอย้อนหลังได้ ${lc.back || 0} วัน (วันที่มาทำงาน ระบบคิดสายใหม่ให้)` :
               leaveType === 'พักร้อน' ? 'พักร้อน = ไม่ได้ค่าแรง ไม่ได้ค่าอาหาร ไม่หักแรง · แตะเลือกได้หลายวัน (ครั้งละไม่เกิน 14 วัน)' + backTxt :
               (leaveType === 'ลาป่วย' && !lc.sickDeduct ? 'ลาป่วยไม่หักแรง' : 'ตัวเลขใต้วัน = แรงที่หัก (อังคาร ศุกร์ เสาร์ หักหนักกว่า)') + backTxt;
  app.innerHTML = `
    <div class="seg">${[['ลากิจ', 'ลากิจ'], ['ลาป่วย', 'ลาป่วย'], ['พักร้อน', 'พักร้อน'], ['ขอเข้าสาย', 'เข้าสาย']].map(x =>
      `<button data-t="${x[0]}" class="${leaveType === x[0] ? 'on' : ''}">${x[1]}</button>`).join('')}</div>
    <div class="card"><div class="muted" style="margin-bottom:8px">${hint}</div><div class="cal">${grid}</div>
      <div class="legend"><span><i class="dot on"></i>เลือกอยู่</span>
        <span><i class="dot appr"></i>ลาแล้ว</span><span><i class="dot rej"></i>ไม่อนุมัติ</span></div></div>
    ${sum}
    <button class="btn" id="lvGo" ${picked.length && !busy.leave ? '' : 'disabled'}>${busy.leave ? '<span class="busy">กำลังส่ง</span>' :
      picked.length ? `ส่ง${isPass ? 'ขอเข้าสาย' : 'ใบลา'} ${picked.length} วัน` : 'แตะวันในปฏิทินก่อน'}<small>ระบบนับให้ทันที · ผู้จัดการตรวจตอนปิดงวด</small></button>
    ${mine ? `<div class="gap"></div><div class="card"><h2>ใบลาของฉัน</h2><div class="list">${mine}</div></div>` : ''}`;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { leaveType = b.dataset.t; leaveSel = []; render(); });
  app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k, i = leaveSel.indexOf(k);
    if (i >= 0) leaveSel.splice(i, 1); else if (leaveSel.length < 14) leaveSel.push(k);
    render();
  });
  app.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => twoTap('cancel' + b.dataset.cancel, () => act('cancelLeave', { id: b.dataset.cancel }, s => { s.myLeaves = (s.myLeaves || []).filter(l => l.id !== b.dataset.cancel); })));
  document.getElementById('lvGo').onclick = async () => {
    const r = await act('leave', { type: leaveType, dates: leaveSel.slice().sort() });
    if (r && r.ok) leaveSel = [];
    render();
  };
}

let myText = '';
async function loadMy() {
  try { const r = await api('my'); myText = r.ok ? r.text : (r.error || ''); }
  catch (e) { myText = '📶 โหลดไม่สำเร็จ ลองใหม่'; }
  if (tab === 'my') renderMy();
}
function renderMy() {
  // แปลงสลิปข้อความ ("OT 1 รอบ  →  +50") เป็นรายการอ่านง่าย
  const lines = String(myText || '').split('\n');
  const rows = [], notes = [], edits = [];
  let total = '';
  lines.forEach(l => {
    const t = l.trim();
    if (t.indexOf('📝') === 0) { edits.push(t.replace(/^📝\s*/, '')); return; }
    const m = l.match(/^\s+(.+?)\s+→\s+([+-]?[\d,]+)\s*$/);
    if (!m) { if (t && !/^\S+ · [\d,]+\/วัน$/.test(t)) notes.push(t); return; }
    if (m[1].trim() === 'รวม') total = m[2]; else rows.push([m[1].trim(), m[2]]);
  });
  let html;
  if (!myText) html = loadingHtml();
  else if (!rows.length) html = `<div class="card"><pre>${esc(myText)}</pre></div>`;
  else {
    const head = notes.shift() || '';
    html = `<div class="card hero"><div class="muted">${esc(head.replace(/^📊\s*/, ''))}</div>
        <div class="clock" style="font-size:52px;margin-top:6px">${esc(total)}<span style="font-size:22px"> บาท</span></div>
        <div><span class="status">ยอดถึงตอนนี้</span></div></div>
      <div class="card"><div class="list">${rows.map(r => `<div class="item"><div class="main">${esc(r[0])}</div>
        <div class="amt" style="color:${r[1].charAt(0) === '-' ? 'var(--bad)' : 'var(--ink)'}">${esc(r[1])}</div></div>`).join('')}</div></div>
      ${edits.length ? `<div class="card"><h2>📝 มีการแก้ข้อมูลของคุณ</h2>${edits.map(x => `<div class="muted">• ${esc(x)}</div>`).join('')}</div>` : ''}
      ${notes.filter(n => n.indexOf('※') === 0).map(n => `<div class="muted center">${esc(n)}</div>`).join('')}`;
  }
  document.getElementById('app').innerHTML = html + (myText ? `<div class="more center">${moreBtn('my', 'เพิ่มเติม')}</div>` +
    moreBox('my', '<button class="btn quiet" id="myR" style="margin:0">โหลดใหม่<small>ดึงยอดล่าสุดอีกครั้ง</small></button>') : '');
  const mr = document.getElementById('myR');
  if (mr) mr.onclick = () => { moreOpen = ''; myText = ''; renderMy(); loadMy(); };
}

  const self = x.name === S.me.name, work = x.status === ST_WORK;

    rare += row('ปรับค่าปรับเอง (บาท)', `<input type="number" id="mBaht" min="0" value="${x.fine}" style="width:90px">`, 'fine');
  }

  if (rare) h += `<div class="more">${moreBtn('mg', 'เพิ่มเติม')}</div>${moreBox('mg', rare)}`;
  return h + '</div>';
}

/** เปิดดูรูปเข้างาน (แตะที่ไหนก็ปิด) */
async function showPhoto(id) {
  const box = document.createElement('div');

  box.textContent = 'กำลังโหลดรูป…';

let qrLib = null;
